# The deployed stack: the API behind Caddy. FalkorDB is on FalkorDB Cloud (docs/spec/07, "Where FalkorDB runs").
#   docker compose -f deploy/docker-compose.yml up -d --build
# Both services read ../.env (the repo root's), which never enters the image.
name: theseus

services:
  api:
    image: theseus-api:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    restart: unless-stopped
    expose:
      - "8000"
    # The GitHub App's private key, at GITHUB_APP_PRIVATE_KEY_PATH=/app/secrets/theseus.private-key.pem.
    volumes:
      - ../secrets:/app/secrets:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    env_file: ../.env
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
