# The Theseus Action (docs/spec/07-github-and-deploy.md, "The Theseus Action"). It plans the world root at both
# commits, runs Checkov, and sends everything to the backend, which posts the comment and the check run with the
# GitHub App. PR text reaches the shell only through env:, never as ${{ }} inside a run: script.
#
# Needs the repo variable THESEUS_URL and the secret THESEUS_TOKEN. Only the last step holds the token:
# Terraform plans the PR's own files, and a `data "external"` block in them would run during the plan.
name: Theseus

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths: ["demo-infra/**"]

concurrency:
  group: theseus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORLD_ROOT: demo-infra
    steps:
      - name: Check out the head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check out the base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      # tools/plan.sh comes from the base commit, so a PR cannot change how it is planned. Before that script
      # exists on the base, the same three commands run here.
      - name: Plan base and head
        run: |
          set -euo pipefail
          plan() {
            local dir="$1" out="$2"
            if [ ! -d "$dir" ]; then echo "null" > "$out"; return; fi
            if [ -f base/tools/plan.sh ]; then
              bash base/tools/plan.sh "$dir" "$out"
            else
              (
                cd "$dir"
                export TF_IN_AUTOMATION=1 CHECKPOINT_DISABLE=1 AWS_EC2_METADATA_DISABLED=true
                terraform init -backend=false -input=false -no-color >&2
                terraform plan -refresh=false -input=false -lock=false -no-color -out=tfplan >&2
                terraform show -json tfplan
              ) > "$out"
            fi
          }
          plan "$WORLD_ROOT/terraform" head.plan.json
          plan "base/$WORLD_ROOT/terraform" base.plan.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Checkov exits 1 when any check fails; its JSON summary is what the comment shows.
      - name: Run Checkov on the head
        run: |
          set -uo pipefail
          pip install --quiet checkov==3.3.29
          checkov -d "$WORLD_ROOT/terraform" --framework terraform --quiet --compact -o json > checkov.json || true
          jq '(if type == "array" then .[0] else . end) | .summary // null' checkov.json > checkov-summary.json \
            || echo "null" > checkov-summary.json

      - name: Send the review to Theseus
        env:
          THESEUS_URL: ${{ vars.THESEUS_URL }}
          THESEUS_TOKEN: ${{ secrets.THESEUS_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ -z "$THESEUS_URL" ] || [ -z "$THESEUS_TOKEN" ]; then
            echo "::error::Set the repo variable THESEUS_URL and the secret THESEUS_TOKEN"
            exit 1
          fi
          jq -n \
            --arg repo "$REPO" --argjson pr_number "$PR_NUMBER" \
            --arg base_sha "$BASE_SHA" --arg head_sha "$HEAD_SHA" \
            --arg pr_title "$PR_TITLE" --arg pr_body "$PR_BODY" \
            --slurpfile base base.plan.json --slurpfile head head.plan.json \
            --slurpfile checkov checkov-summary.json \
            '{repo: $repo, pr_number: $pr_number, base_sha: $base_sha, head_sha: $head_sha,
              pr_title: $pr_title, pr_body: $pr_body, base_plan: $base[0], head_plan: $head[0],
              checkov: $checkov[0]}' > request.json
          curl --fail-with-body --silent --show-error --max-time 300 \
            --retry 2 --retry-delay 5 --retry-all-errors \
            -X POST "${THESEUS_URL%/}/analyze" \
            -H "Content-Type: application/json" \
            -H "X-Theseus-Token: $THESEUS_TOKEN" \
            --data-binary @request.json -o response.json
          jq -r '.headline // "Theseus reviewed this commit."' response.json
