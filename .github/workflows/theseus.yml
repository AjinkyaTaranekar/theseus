# The Theseus Action (docs/spec/07-github-and-deploy.md, "The Theseus Action"), part 1 of 2: plan the world root
# at both commits and run Checkov. It runs the PR's own Terraform (a `data "external"` block runs during a plan),
# so it is untrusted: it holds no secrets and can reach nothing but this artifact. `Theseus publish` reads the
# artifact when this run finishes and sends it to the backend, which posts the comment and the check run.
name: Theseus

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths: ["demo-infra/**"]

concurrency:
  group: theseus-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORLD_ROOT: demo-infra
    steps:
      - name: Check out the head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check out the base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      # tools/plan.sh comes from the base commit, so a PR cannot change how it is planned. Before that script
      # exists on the base, the same three commands run here.
      - name: Plan base and head
        run: |
          set -euo pipefail
          plan() {
            local dir="$1" out="$2"
            if [ ! -d "$dir" ]; then echo "null" > "$out"; return; fi
            if [ -f base/tools/plan.sh ]; then
              bash base/tools/plan.sh "$dir" "$out"
            else
              (
                cd "$dir"
                export TF_IN_AUTOMATION=1 CHECKPOINT_DISABLE=1 AWS_EC2_METADATA_DISABLED=true
                terraform init -backend=false -input=false -no-color >&2
                terraform plan -refresh=false -input=false -lock=false -no-color -out=tfplan >&2
                terraform show -json tfplan
              ) > "$out"
            fi
          }
          plan "$WORLD_ROOT/terraform" head.plan.json
          plan "base/$WORLD_ROOT/terraform" base.plan.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Checkov exits 1 when any check fails; its JSON summary is what the comment shows.
      - name: Run Checkov on the head
        run: |
          set -uo pipefail
          pip install --quiet checkov==3.3.29
          checkov -d "$WORLD_ROOT/terraform" --framework terraform --quiet --compact -o json > checkov.json || true
          jq '(if type == "array" then .[0] else . end) | .summary // null' checkov.json > checkov-summary.json \
            || echo "null" > checkov-summary.json

      # Data only. `Theseus publish` takes the commit from its own event, not from here, and the backend checks
      # the PR number against that commit, so nothing here can point a review at another PR.
      - name: Save the review inputs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          jq -n --argjson pr_number "$PR_NUMBER" \
            --slurpfile base base.plan.json --slurpfile head head.plan.json \
            --slurpfile checkov checkov-summary.json \
            '{pr_number: $pr_number, base_plan: $base[0], head_plan: $head[0], checkov: $checkov[0]}' \
            > review.json

      - uses: actions/upload-artifact@v4
        with:
          name: theseus-review
          path: review.json
          if-no-files-found: error
          retention-days: 1
          overwrite: true
