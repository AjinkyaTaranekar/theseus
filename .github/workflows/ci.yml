name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A demo PR (branch demo/<scenario>-<take>) changes demo-infra/ on purpose, so the tests that pin it to
  # main fail by design; its review is the Theseus check (docs/spec/07-github-and-deploy.md, "Demo PRs").
  check:
    if: ${{ !startsWith(github.head_ref, 'demo/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the commit message check reads every commit in the PR

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest -q

      # PR text reaches the shell only through env, never through ${{ }} inside run.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_commit_msg.py --range "$BASE_SHA..$HEAD_SHA"

      - name: PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          python tools/check_commit_msg.py "$RUNNER_TEMP/pr-title.txt"

  windows:
    if: ${{ !startsWith(github.head_ref, 'demo/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

  # The falkordb-marked tests, against the version FalkorDB Cloud runs (docs/spec/07, "Where FalkorDB runs").
  falkordb:
    if: ${{ !startsWith(github.head_ref, 'demo/') }}
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.0
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: "6379"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: FalkorDB tests
        run: pytest -q -m falkordb

  # Nobody builds the image on a laptop, so CI does, before it reaches the VM.
  image:
    if: ${{ !startsWith(github.head_ref, 'demo/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the API image
        run: docker build -f deploy/Dockerfile -t theseus-api:ci .

      - name: The image starts the app
        run: docker run --rm theseus-api:ci python -c "import theseus.api.app"

      - name: The compose file is valid
        run: touch .env && docker compose -f deploy/docker-compose.yml config --quiet
