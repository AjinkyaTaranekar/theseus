<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<title>Theseus dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #000000; --panel: #0b0c0e; --panel-2: #121418; --border: #202226; --border-2: #33363c;
    --text: #e8e9ec; --text-2: #b9bdc5; --muted: #8f949d;
    --primary: #6e9fff; --primary-bg: rgba(87, 148, 242, .14);
    --green: #73bf69; --yellow: #fade2a; --orange: #ff9830; --red: #f2495c; --purple: #b877d9; --blue: #5794f2;
    --green-bg: rgba(115, 191, 105, .14); --yellow-bg: rgba(250, 222, 42, .12); --orange-bg: rgba(255, 152, 48, .14);
    --red-bg: rgba(242, 73, 92, .15); --blue-bg: rgba(87, 148, 242, .14);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
    --side: 224px; --top: 52px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip { position: absolute; left: 8px; top: -40px; background: var(--primary); color: #000; padding: 8px 12px; border-radius: 4px; z-index: 10; font-weight: 600; }
  .skip:focus { top: 8px; }
  .mono { font-family: var(--mono); }

  /* Shell */
  .app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
  .side { background: var(--bg); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; height: var(--top); padding: 0 16px; border-bottom: 1px solid var(--border); font-weight: 700; letter-spacing: -.01em; color: var(--text); }
  .brand svg { width: 22px; height: 22px; }
  .side ul { list-style: none; margin: 0; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
  .side a.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 4px; color: var(--text-2); font-weight: 500; text-decoration: none; }
  .side a.nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .side a.nav:hover { background: var(--panel-2); color: var(--text); }
  .side a.nav[aria-current="page"] { background: var(--primary-bg); color: var(--text); box-shadow: inset 2px 0 0 var(--primary); }
  .side .count { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--muted); }
  .side .count.bad { color: var(--red); }
  .side-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .side-foot b { display: block; color: var(--text-2); font-weight: 500; }
  .frame { min-width: 0; display: flex; flex-direction: column; }
  .top { position: sticky; top: 0; z-index: 3; height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 20px; background: rgba(0, 0, 0, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .crumbs ol { list-style: none; display: flex; align-items: center; gap: 6px; margin: 0; padding: 0; font-weight: 500; white-space: nowrap; }
  .crumbs li + li::before { content: "/"; color: var(--muted); margin-right: 6px; }
  .crumbs a { color: var(--text-2); }
  .crumbs [aria-current] { color: var(--text); }
  .search { margin-left: auto; position: relative; width: min(360px, 40vw); }
  .search input { width: 100%; height: 32px; background: var(--panel); color: var(--text); border: 1px solid var(--border-2); border-radius: 4px; padding: 0 10px 0 30px; font: inherit; }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; left: 9px; top: 9px; width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; }
  .fresh { font: 12px/1 var(--mono); color: var(--text-2); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 9px 10px; white-space: nowrap; }
  .fresh .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
  .btn { height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text); font: 500 13px/1 var(--font); cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn[disabled] { opacity: .45; cursor: default; }
  main { padding: 20px 20px 40px; }
  main:focus { outline: none; }
  .pagehead { display: flex; align-items: flex-end; gap: 16px; margin: 0 0 16px; flex-wrap: wrap; }
  .pagehead h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .pagehead p { margin: 2px 0 0; color: var(--text-2); max-width: 920px; }
  .pagehead .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  select { height: 32px; background: var(--panel); color: var(--text); border: 1px solid var(--border-2); border-radius: 4px; padding: 0 8px; font: inherit; }

  /* Panels */
  .grid { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; min-width: 0; display: flex; flex-direction: column; }
  .panel > h2 { margin: 0; padding: 10px 12px 0; font-size: 13px; font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .panel > h2 .hint { margin-left: auto; font: 11px/1.2 var(--mono); color: var(--muted); font-weight: 400; text-align: right; }
  .panel .body { padding: 10px 12px 12px; min-width: 0; flex: 1; }
  .panel .body.flush { padding: 8px 0 0; }
  .s4 { grid-column: span 4; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; } .s16 { grid-column: span 16; } .s24 { grid-column: span 24; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .v { font: 600 30px/1.1 var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-decoration: none; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .stat svg { margin-top: 6px; width: 100%; height: 28px; }
  .tone-red { color: var(--red); } .tone-orange { color: var(--orange); } .tone-yellow { color: var(--yellow); } .tone-green { color: var(--green); } .tone-blue { color: var(--blue); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; margin-right: 6px; vertical-align: 3px; border-radius: 2px; }
  .chart text { font: 10px var(--mono); fill: var(--muted); }

  /* Tables */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; font-weight: 500; color: var(--muted); padding: 0 12px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  thead th button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  thead th button::after { content: "↕"; opacity: .35; font-size: 11px; }
  thead th[aria-sort="ascending"] button::after { content: "↑"; opacity: 1; color: var(--text); }
  thead th[aria-sort="descending"] button::after { content: "↓"; opacity: 1; color: var(--text); }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
  tbody tr:hover td { background: var(--panel-2); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .sub { color: var(--muted); font-size: 12px; }
  .pager { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .pager .btn { height: 26px; padding: 0 10px; font-size: 12px; }
  .pager span:first-child { margin-right: auto; }
  .empty { padding: 18px 12px; color: var(--muted); }

  /* Labels */
  .badge { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px/1 var(--font); padding: 4px 7px; border-radius: 3px; white-space: nowrap; border: 1px solid transparent; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .b-red { color: var(--red); background: var(--red-bg); } .b-orange { color: var(--orange); background: var(--orange-bg); }
  .b-yellow { color: var(--yellow); background: var(--yellow-bg); } .b-green { color: var(--green); background: var(--green-bg); }
  .b-blue { color: var(--blue); background: var(--blue-bg); } .b-grey { color: var(--text-2); background: var(--panel-2); border-color: var(--border-2); }
  .chip { display: inline-block; font: 12px/1.4 var(--mono); padding: 1px 6px; margin: 2px 4px 2px 0; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--border-2); color: var(--text-2); white-space: nowrap; }
  .chip.regulated { border-color: rgba(242, 73, 92, .5); color: #ff8e9a; }
  .chip.confidential { border-color: rgba(255, 152, 48, .5); color: #ffb870; }
  .chip.needed { border-style: dashed; color: var(--muted); }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .bar > span { display: block; height: 100%; border-radius: 3px; }
  .gauge { display: grid; grid-template-columns: minmax(120px, 34%) 1fr max-content; gap: 8px 10px; align-items: center; font-size: 12.5px; }
  .gauge .bar { height: 14px; border-radius: 2px; }
  .gauge .bar > span { border-radius: 2px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .steps li:last-child { border-bottom: 0; }
  .tick { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--mono); border: 1px solid var(--border-2); color: var(--muted); }
  .tick.done { background: var(--green); border-color: var(--green); color: #000; }
  code.cmd { display: block; font: 12px/1.5 var(--mono); background: #000; border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; margin-top: 4px; overflow-wrap: anywhere; color: var(--text-2); }
  .message { padding: 80px 20px; color: var(--text-2); font-size: 15px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  @media (max-width: 1280px) { .s4 { grid-column: span 8; } .s6 { grid-column: span 12; } }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    .side { position: static; height: auto; }
    .side ul { flex-direction: row; flex-wrap: wrap; }
    .side-foot { display: none; }
    .s4, .s6, .s8 { grid-column: span 12; } .s12, .s16 { grid-column: span 24; }
    .fresh { display: none; }
  }
  @media (max-width: 640px) { .s4, .s6, .s8 { grid-column: span 24; } main { padding: 14px 12px 32px; } .top { padding: 0 12px; } }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="app">
  <nav class="side" aria-label="Sections">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z" fill="none" stroke="#6e9fff" stroke-width="1.8"/><circle cx="12" cy="12" r="2.6" fill="#6e9fff"/></svg><span>Theseus</span></div>
    <ul id="nav"></ul>
    <div class="side-foot" id="sidefoot"></div>
  </nav>
  <div class="frame">
    <header class="top">
      <nav class="crumbs" aria-label="Breadcrumb"><ol id="crumbs"></ol></nav>
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <label class="sr-only" for="q">Search this view</label>
        <input id="q" type="search" placeholder="Search this view" autocomplete="off">
      </div>
      <span class="fresh" id="fresh" hidden></span>
      <button class="btn" id="refresh" type="button">Refresh</button>
    </header>
    <main id="content" tabindex="-1">
      <div class="pagehead"><div><h1 id="h1">Loading</h1><p id="sub"></p></div><div class="tools" id="tools"></div></div>
      <div id="view"></div>
      <p class="sr-only" aria-live="polite" id="live"></p>
    </main>
  </div>
</div>

<script>
"use strict";
// Plain words for what a node is, and for the data it holds.
const KINDS = { user: "person", group: "group", role: "role", workload: "service", workflow: "CI workflow",
                action: "GitHub Action", entry: "internet", secret: "secret", db: "database", dynamodb: "table",
                sqs: "queue", sns: "topic", logs: "logs", kms: "key" };
const CATEGORIES = { objectstorage: "storage", filestorage: "file share", blockstorage: "disk", database: "database",
                     secret: "secret", encryptionkey: "key", aimodel: "AI model", logstore: "logs",
                     messagequeue: "queue", messagetopic: "topic", datastream: "stream" };
const CLASS = { regulated: ["Customer data", "b-red"], confidential: ["Business data", "b-orange"],
                internal: ["Internal", "b-blue"], public: ["Public", "b-grey"] };
const TRIGGERS = { push: "push to main", schedule: "nightly run", workflow_dispatch: "manual run", cli: "command line" };
const VERDICT = { blocked: ["Blocked", "b-red"], look: ["Needs a look", "b-yellow"], clear: ["Clear", "b-green"] };
const FIX = { pass: "b-green", fail: "b-red", invalid: "b-red", unknown: "b-grey" };
const TONES = { red: "#f2495c", orange: "#ff9830", yellow: "#fade2a", green: "#73bf69", blue: "#5794f2", purple: "#b877d9" };
const PAGE = 25;
const ICONS = {
  overview: "M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3zM14 14h7v7h-7z",
  repos: "M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01",
  prs: "M6 3v12M6 15a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM18 21V9a3 3 0 0 0-3-3h-4M13 3l-2 3 2 3",
  findings: "M12 2l9 4v6c0 5-4 9-9 10-5-1-9-5-9-10V6zM12 8v5M12 16h.01",
  access: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0",
  weak: "M12 3l10 18H2zM12 10v4M12 17h.01",
  cost: "M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6",
  setup: "M4 6h16M4 12h16M4 18h16M8 4v4M16 10v4M10 16v4",
};

const $ = (id) => document.getElementById(id);
function el(tag, text, attrs) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = text;
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}
function add(parent, ...kids) { for (const k of kids) if (k !== null && k !== undefined && k !== false) parent.append(k); return parent; }
function svg(tag, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, String(v));
  return node;
}
function icon(name) { const s = svg("svg", { viewBox: "0 0 24 24", "aria-hidden": "true" }); s.append(svg("path", { d: ICONS[name] })); return s; }
function nameOf(id) {
  if (id === "entry:internet") return "anyone on the internet";
  const url = id.indexOf("://");
  if (url >= 0) return id.slice(url + 3);
  const i = id.indexOf(":");
  const name = i < 0 ? id : id.slice(i + 1);
  return id.startsWith("workflow:") ? name.split("/").slice(-2).join("/") : name;
}
function kindOf(id, info) {
  const cat = ((info && info.category) || "").toLowerCase();
  if (CATEGORIES[cat]) return CATEGORIES[cat];
  return KINDS[id.split(":")[0]] || (id.includes("://") ? "storage" : "node");
}
function plural(n, word, many) { return `${n} ${n === 1 ? word : (many || word + "s")}`; }
function list(items) { return items.length <= 1 ? items.join("") : `${items.slice(0, -1).join(", ")} and ${items[items.length - 1]}`; }
function ago(iso) {
  if (!iso) return "";
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000);
  if (s < 90) return "just now";
  if (s < 5400) return `${Math.round(s / 60)} min ago`;
  if (s < 129600) return `${Math.round(s / 3600)} h ago`;
  return `${Math.round(s / 86400)} d ago`;
}
function usd(n) { return `$${(n || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`; }
function badge(text, tone) { return el("span", text, { class: `badge ${tone}` }); }
function classBadge(sens) { const c = CLASS[sens]; return c ? badge(c[0], c[1]) : badge("Unclassified", "b-grey"); }

// The scope (an organisation or one repository), the signed key, and the view named in the hash.
const K = new URLSearchParams(location.search).get("k") || "";
const ORG = location.pathname.startsWith("/org/");
const BASE = location.pathname.replace(/\/$/, "");
let renderView = () => {};
let TABLES = [];

async function fetchJson(path) {
  const join = path.includes("?") ? "&" : "?";
  const res = await fetch(`${path}${join}k=${encodeURIComponent(K)}`, { cache: "no-store" });
  if (!res.ok) throw new Error(String(res.status));
  return res.json();
}

// Components -------------------------------------------------------------------------------------------
function panel(title, span, opts) {
  const p = el("section", null, { class: `panel ${span}`, "aria-label": title });
  const h = add(el("h2"), document.createTextNode(title));
  if (opts && opts.hint) h.append(el("span", opts.hint, { class: "hint" }));
  const body = el("div", null, { class: `body${opts && opts.flush ? " flush" : ""}` });
  add(p, h, body);
  return [p, body];
}
function sparkline(values, color) {
  const s = svg("svg", { viewBox: "0 0 100 28", preserveAspectRatio: "none", "aria-hidden": "true" });
  if (!values || values.length < 2) { s.append(svg("line", { x1: 0, y1: 26, x2: 100, y2: 26, stroke: "#33363c", "stroke-width": 1, "vector-effect": "non-scaling-stroke" })); return s; }
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const pts = values.map((v, i) => `${(i / (values.length - 1)) * 100},${26 - ((v - min) / (max - min || 1)) * 22}`);
  s.append(svg("polygon", { points: `0,28 ${pts.join(" ")} 100,28`, fill: color, opacity: 0.12 }));
  s.append(svg("polyline", { points: pts.join(" "), fill: "none", stroke: color, "stroke-width": 1.6, "vector-effect": "non-scaling-stroke" }));
  return s;
}
function statPanel(title, value, label, tone, series, href) {
  const [p, body] = panel(title, "s4");
  const box = el("div", null, { class: "stat" });
  const v = el(href ? "a" : "div", String(value), { class: `v tone-${tone}` });
  if (href) v.setAttribute("href", href);
  add(box, v, el("div", label, { class: "l" }), sparkline(series, TONES[tone] || TONES.blue));
  body.append(box);
  return p;
}
function timeseries(runs, lines) {
  const W = 640, H = 200, L = 34, R = 10, T = 10, B = 24;
  const s = svg("svg", { viewBox: `0 0 ${W} ${H}`, class: "chart", role: "img", width: "100%", height: H });
  const title = svg("title");
  title.textContent = `Posture of main over ${plural(runs.length, "run")}`;
  s.append(title);
  const max = Math.max(1, ...runs.flatMap((r) => lines.map((l) => r[l.key] || 0)));
  const y = (v) => T + (H - T - B) * (1 - v / max);
  const x = (i) => L + (runs.length <= 1 ? (W - L - R) / 2 : (i / (runs.length - 1)) * (W - L - R));
  for (let i = 0; i <= 4; i++) {
    const v = Math.round((max * i) / 4), yy = y(v);
    s.append(svg("line", { x1: L, x2: W - R, y1: yy, y2: yy, stroke: "#202226", "stroke-width": 1 }));
    const t = svg("text", { x: L - 6, y: yy + 3, "text-anchor": "end" });
    t.textContent = String(v);
    s.append(t);
  }
  const ticks = runs.length > 1 ? [0, Math.floor((runs.length - 1) / 2), runs.length - 1] : [0];
  for (const i of [...new Set(ticks)]) {
    const anchor = runs.length === 1 ? "middle" : i === 0 ? "start" : i === runs.length - 1 ? "end" : "middle";
    const t = svg("text", { x: x(i), y: H - 6, "text-anchor": anchor });
    t.textContent = new Date(runs[i].at).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    s.append(t);
  }
  for (const l of lines) {

// A table that sorts, follows the top bar's search box, and pages. Columns: {label, value, cell, num}.
function table(caption, columns, rows, opts) {
  const o = Object.assign({ page: PAGE, sort: null, desc: true, search: (r) => JSON.stringify(r), empty: "Nothing here." }, opts || {});
  const wrap = el("div");
  const state = { sort: o.sort, desc: o.desc, page: 0 };
  function draw() {
    wrap.replaceChildren();
    const needle = $("q").value.trim().toLowerCase();
    const shown = needle ? rows.filter((r) => o.search(r).toLowerCase().includes(needle)) : [...rows];
    if (state.sort !== null) {
      const col = columns[state.sort];
      shown.sort((a, b) => { const x = col.value(a), y = col.value(b); const c = x < y ? -1 : x > y ? 1 : 0; return state.desc ? -c : c; });
    }
    const pages = Math.max(1, Math.ceil(shown.length / o.page));
    state.page = Math.min(state.page, pages - 1);
    const slice = shown.slice(state.page * o.page, state.page * o.page + o.page);
    const t = el("table");
    t.append(el("caption", caption, { class: "sr-only" }));
    const tr = el("tr");
    columns.forEach((c, i) => {
      const th = el("th", null, { scope: "col", class: c.num ? "num" : "" });
      if (c.value) {
        const b = el("button", c.label, { type: "button" });
        b.addEventListener("click", () => { state.desc = state.sort === i ? !state.desc : true; state.sort = i; state.page = 0; draw(); });
        th.append(b);
        if (state.sort === i) th.setAttribute("aria-sort", state.desc ? "descending" : "ascending");
      } else th.textContent = c.label;
      tr.append(th);

    t.append(add(el("thead"), tr));
    const tb = el("tbody");
    for (const r of slice) {
      const row = el("tr");
      for (const c of columns) {
        const td = el("td", null, { class: c.num ? "num" : "" });
        const v = c.cell(r);
        if (v instanceof Node) td.append(v); else td.textContent = v;
        row.append(td);
      }
      tb.append(row);
    }
    t.append(tb);
    const tw = el("div", null, { class: "tablewrap" });
    tw.append(shown.length ? t : el("div", needle ? `Nothing matches "${needle}".` : o.empty, { class: "empty" }));
    wrap.append(tw);
    if (shown.length > o.page || needle) {
      const from = shown.length ? state.page * o.page + 1 : 0, to = Math.min(shown.length, (state.page + 1) * o.page);
      const prev = el("button", "Previous", { class: "btn", type: "button", "aria-label": "Previous page" });
      const next = el("button", "Next", { class: "btn", type: "button", "aria-label": "Next page" });
      prev.disabled = state.page === 0;
      next.disabled = state.page >= pages - 1;

      next.addEventListener("click", () => { state.page++; draw(); });
      const text = `${from}–${to} of ${shown.length}`;

      $("live").textContent = `${caption}: ${text}`;

      statPanel("Fixed price", fixed.length, "resources priced from the code", "blue", null),
      statPanel("Billed by use", usage.length, "counted at $0 without usage data", "blue", null),
      statPanel("Could save", usd(cost.savings_usd), cost.savings.length ? `${plural(cost.savings.length, "resource")} nothing reaches` : "no left-over resources", cost.savings_usd ? "orange" : "green", null),
    );
    const [bp, bb] = panel("Cost by resource", "s12", { hint: "a month" });
    bb.append(fixed.length ? gauge(fixed.slice(0, 12).map((l) => ({ label: l.address.replace(/^aws_/, ""), title: l.address, value: l.monthly_usd, text: usd(l.monthly_usd) })), TONES.blue) : el("div", "Nothing with a fixed price.", { class: "empty" }));
    const [sp, sb] = panel("How to save", "s12");
    const steps = el("ul", null, { class: "steps" });
    const item = (title, text) => steps.append(add(el("li"), add(el("div"), el("div", title), el("div", text, { class: "sub" }))));
    for (const v of cost.savings) item(`${nameOf(v.id)}: ${usd(v.monthly_usd)} a month`, v.reason);
    if (!cost.savings.length) item("No left-over resources", "Every data store is reached by someone or called by code.");
    if (scan && scan.unused_grants.length) item(`${plural(scan.unused_grants.length, "grant")} to remove for free`, "Access no code uses: removing it shrinks the blast radius and breaks nothing.");
    if (fixed[0]) item(`Largest line: ${fixed[0].address}`, `${usd(fixed[0].monthly_usd)} a month for ${fixed[0].basis}. Check it is sized for its load.`);
    sb.append(steps);
    const [tp, tb] = panel("Every priced resource", "s24", { flush: true });
    tb.append(table("Every priced resource", [
      { label: "Resource", value: (l) => l.address, cell: (l) => el("span", l.address, { class: "mono" }) },
      { label: "What it counts", value: (l) => l.basis, cell: (l) => el("span", l.basis, { class: "sub" }) },
      { label: "Billing", value: (l) => (l.usage_billed ? 1 : 0), cell: (l) => (l.usage_billed ? badge("By use", "b-grey") : badge("Fixed", "b-blue")) },
      { label: "Month", value: (l) => l.monthly_usd, num: true, cell: (l) => usd(l.monthly_usd) },
    ], cost.lines, { sort: 3, search: (l) => `${l.address} ${l.basis}` }));
    $("view").append(stats, grid(bp, sp), grid(tp));
  };

  views.setup = () => {
    head("Setup", "What Theseus can see is connected for this repository, and how each part runs.");
    const [sp, sb] = panel("Connection", "s12");
    const steps = el("ul", null, { class: "steps" });
    for (const s of d.onboarding) steps.append(add(el("li"), el("span", s.done ? "✓" : "", { class: `tick ${s.done ? "done" : ""}`, role: "img", "aria-label": s.done ? "done" : "not done" }), add(el("div"), el("div", s.step), el("div", s.detail, { class: "sub" }))));
    sb.append(steps);
    const [rp, rb] = panel("How it runs", "s12");
    const runList = el("ul", null, { class: "steps" });
    for (const [h, text, code] of [
      ["Pull requests", "Every push to a PR that changes the infrastructure is reviewed again. To ask again:", "/theseus review"],
      ["Apply a fix", "A person with write access approves a fix that passed:", "/theseus apply B"],
      ["main", "On every push to main, nightly at 03:17 UTC, and from Actions, Theseus main, Run workflow.", "python -m theseus posture <world> <plan>"],
      ["Advisories", "Each scan of main checks the advisory feed, and opens a containment PR when the fix passes.", "python -m theseus finding fixtures/compromised-action"],
    ]) runList.append(add(el("li"), add(el("div"), el("div", h), el("div", text, { class: "sub" }), el("code", code, { class: "cmd" }))));
    rb.append(runList);
    $("view").append(grid(sp, rp));
  };

  shell([
    { id: "overview", label: "Overview", icon: "overview" },
    { id: "prs", label: "Pull requests", icon: "prs", count: blocked, bad: true },
    { id: "findings", label: "Findings", icon: "findings", count: d.findings.length, bad: true },
    { id: "access", label: "Who reaches what", icon: "access", count: dangerous.length, bad: true },
    { id: "weak", label: "Weak points", icon: "weak" },
    { id: "cost", label: "Cost", icon: "cost" },
    { id: "setup", label: "Setup", icon: "setup" },
  ], [{ label: d.org, href: d.org_url }, { label: d.repo.split("/")[1] }], posture ? `main@${posture.sha.slice(0, 7)} · ${ago(posture.updated_at)}` : null);
  const g = d.main_graph;
  $("sidefoot").replaceChildren(el("div", "Graph in FalkorDB"), el("b", g ? `${g.nodes.toLocaleString()} nodes · ${g.edges.toLocaleString()} edges` : "not built yet"));
  return views;
}

// The whole organisation -----------------------------------------------------------------------------------
function orgViews(d) {
  const t = d.totals;
  const scanned = d.repos.filter((r) => r.scanned);
  const views = {};
  const repoTable = (page) => table("Repositories", [
    { label: "Repository", value: (r) => r.repo, cell: (r) => add(el("div"), r.url ? el("a", r.repo.split("/")[1], { href: r.url }) : el("span", r.repo), el("div", r.scanned ? `main@${r.sha.slice(0, 7)} · ${ago(r.updated_at)}` : "not scanned yet", { class: "sub mono" })) },
    { label: "Dangerous paths", value: (r) => r.dangerous || 0, num: true, cell: (r) => el("span", r.scanned ? String(r.dangerous) : "–", { class: r.dangerous ? "tone-red" : "" }) },
    { label: "Customer data", value: (r) => r.regulated || 0, num: true, cell: (r) => (r.scanned ? String(r.regulated) : "–") },
    { label: "Blocked PRs", value: (r) => r.reviews.blocked, num: true, cell: (r) => `${r.reviews.blocked}/${r.reviews.blocked + r.reviews.look + r.reviews.clear}` },
    { label: "Advisories", value: (r) => (r.findings || []).length, num: true, cell: (r) => (r.scanned ? String(r.findings.length) : "–") },
    { label: "Single points", value: (r) => r.single_points || 0, num: true, cell: (r) => (r.scanned ? String(r.single_points) : "–") },
    { label: "Nodes / edges", value: (r) => r.nodes || 0, num: true, cell: (r) => (r.scanned ? `${r.nodes.toLocaleString()} / ${r.edges.toLocaleString()}` : "–") },
    { label: "Cost / month", value: (r) => r.monthly_usd || 0, num: true, cell: (r) => (r.scanned ? usd(r.monthly_usd) : "–") },
    { label: "Trend", value: null, cell: (r) => { const s = sparkline((r.history || []).map((h) => h.dangerous), TONES.red); s.style.width = "90px"; s.style.height = "22px"; return s; } },
  ], d.repos, { page, sort: 1, empty: "No repository is connected yet.", search: (r) => r.repo });

  views.overview = () => {
    head(d.org, `${plural(t.repos, "repository", "repositories")} connected, ${t.scanned} scanned. Each repository's main is its own graph in FalkorDB, rebuilt on every push and every night; this page adds them up.`);
    const daily = (key) => {
      const byDay = new Map();
      for (const r of scanned) for (const h of r.history || []) { const day = h.at.slice(0, 10); byDay.set(day, (byDay.get(day) || 0) + (h[key] || 0)); }
      return [...byDay.entries()].sort().map(([, v]) => v);
    };
    const stats = grid(
      statPanel("Dangerous paths", t.dangerous, `across ${plural(t.scanned, "repository", "repositories")}`, t.dangerous ? "red" : "green", daily("dangerous"), "#repos"),
      statPanel("Customer data", t.regulated, "paths to regulated data", t.regulated ? "red" : "green", null),
      statPanel("Pull requests", `${t.blocked}/${t.reviewed}`, "blocked from merging", t.blocked ? "orange" : "green", null),
      statPanel("Advisories", t.findings, "affect a workflow on main", t.findings ? "red" : "green", daily("findings")),
      statPanel("Graph size", (t.nodes + t.edges).toLocaleString(), `${t.nodes.toLocaleString()} nodes, ${t.edges.toLocaleString()} edges in FalkorDB`, "blue", null),
      statPanel("Monthly cost", usd(t.monthly_usd), "estimated at list price", "blue", daily("monthly_usd")),
    );
    const [rp, rb] = panel("Repositories", "s24", { flush: true, hint: "riskiest first; open one for its own dashboard" });
    rb.append(repoTable(10));
    const top = scanned.flatMap((r) => (r.top || []).map((x) => ({ ...x, repo: r.repo, url: r.url })));
    const [tp, tb] = panel("Top risks across the organisation", "s24", { flush: true, hint: "the riskiest paths of each repository" });
    tb.append(table("Top risks across the organisation", [
      { label: "Repository", value: (x) => x.repo, cell: (x) => (x.url ? el("a", x.repo.split("/")[1], { href: `${x.url}#access` }) : x.repo) },
      { label: "Who", value: (x) => nameOf(x.actor), cell: (x) => nameOf(x.actor) },
      { label: "Could reach", value: (x) => nameOf(x.target), cell: (x) => el("span", nameOf(x.target), { class: "mono" }) },
      { label: "Class", value: (x) => (x.sensitivity === "regulated" ? 0 : 1), cell: (x) => classBadge(x.sensitivity) },
      { label: "Hops", value: (x) => x.hops, num: true, cell: (x) => String(x.hops) },
    ], top, { page: 10, sort: 3, desc: false, empty: "Nothing reaches sensitive data it doesn't need.", search: (x) => `${x.repo} ${x.actor} ${x.target}` }));
    $("view").append(stats, grid(rp), grid(tp));
  };
  views.repos = () => {
    head("Repositories", "Every repository connected to Theseus. Search, sort and open one.");
    const [rp, rb] = panel("Repositories", "s24", { flush: true });
    rb.append(repoTable(PAGE));
    $("view").append(grid(rp));
  };
  shell([
    { id: "overview", label: "Overview", icon: "overview" },
    { id: "repos", label: "Repositories", icon: "repos", count: t.repos },
  ], [{ label: d.org }], `${t.scanned}/${t.repos} scanned`);
  $("sidefoot").replaceChildren(el("div", "Graphs in FalkorDB"), el("b", `${t.nodes.toLocaleString()} nodes · ${t.edges.toLocaleString()} edges`));
  return views;
}

// Start --------------------------------------------------------------------------------------------------
async function load() {
  let data;
  try { data = await fetchJson(`${BASE}/data`); }
  catch (e) {
    head("Not found", "");
    $("view").replaceChildren(el("p", "This link doesn't open a dashboard. It may be mistyped or out of date.", { class: "message" }));
    return;
  }
  const views = ORG ? orgViews(data) : repoViews(data);
  renderView = () => route(views, "overview");
  renderView();
}
let timer = null;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => TABLES.forEach((tbl) => tbl.redraw()), 200); });
$("refresh").addEventListener("click", () => load());
window.addEventListener("hashchange", () => { $("q").value = ""; renderView(); $("content").focus({ preventScroll: true }); });
load();
</script>
</body>
</html>
