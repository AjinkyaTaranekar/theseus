<title>Theseus dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #000000; --panel: #0b0c0e; --panel-2: #121418; --border: #202226; --border-2: #33363c;
    --text: #e8e9ec; --text-2: #b9bdc5; --muted: #8f949d;
    --primary: #6e9fff; --primary-bg: rgba(87, 148, 242, .14);
    --green: #73bf69; --yellow: #fade2a; --orange: #ff9830; --red: #f2495c; --purple: #b877d9; --blue: #5794f2;
    --green-bg: rgba(115, 191, 105, .14); --yellow-bg: rgba(250, 222, 42, .12); --orange-bg: rgba(255, 152, 48, .14);
    --red-bg: rgba(242, 73, 92, .15); --blue-bg: rgba(87, 148, 242, .14);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
    --side: 224px; --top: 52px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: var(--primary); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip { position: absolute; left: 8px; top: -40px; background: var(--primary); color: #000; padding: 8px 12px; border-radius: 4px; z-index: 10; font-weight: 600; }
  .skip:focus { top: 8px; }
  .mono { font-family: var(--mono); }

  /* Shell */
  .app { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100%; }
  .side { background: var(--bg); border-right: 1px solid var(--border); position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 10px; height: var(--top); padding: 0 16px; border-bottom: 1px solid var(--border); font-weight: 700; letter-spacing: -.01em; color: var(--text); }
  .brand svg { width: 22px; height: 22px; }
  .side ul { list-style: none; margin: 0; padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
  .side a.nav { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 4px; color: var(--text-2); font-weight: 500; text-decoration: none; }
  .side a.nav svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .side a.nav:hover { background: var(--panel-2); color: var(--text); }
  .side a.nav[aria-current="page"] { background: var(--primary-bg); color: var(--text); box-shadow: inset 2px 0 0 var(--primary); }
  .side .count { margin-left: auto; font: 500 11px/1 var(--mono); color: var(--muted); }
  .side .count.bad { color: var(--red); }
  .side-foot { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .side-foot b { display: block; color: var(--text-2); font-weight: 500; }
  .frame { min-width: 0; display: flex; flex-direction: column; }
  .top { position: sticky; top: 0; z-index: 3; height: var(--top); display: flex; align-items: center; gap: 12px; padding: 0 20px; background: rgba(0, 0, 0, .92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--border); }
  .crumbs ol { list-style: none; display: flex; align-items: center; gap: 6px; margin: 0; padding: 0; font-weight: 500; white-space: nowrap; }
  .crumbs li + li::before { content: "/"; color: var(--muted); margin-right: 6px; }
  .crumbs a { color: var(--text-2); }
  .crumbs [aria-current] { color: var(--text); }
  .search { margin-left: auto; position: relative; width: min(360px, 40vw); }
  .search input { width: 100%; height: 32px; background: var(--panel); color: var(--text); border: 1px solid var(--border-2); border-radius: 4px; padding: 0 10px 0 30px; font: inherit; }
  .search input::placeholder { color: var(--muted); }
  .search svg { position: absolute; left: 9px; top: 9px; width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; }
  .fresh { font: 12px/1 var(--mono); color: var(--text-2); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 9px 10px; white-space: nowrap; }
  .fresh .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
  .btn { height: 32px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--border-2); background: var(--panel-2); color: var(--text); font: 500 13px/1 var(--font); cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn[disabled] { opacity: .45; cursor: default; }
  main { padding: 20px 20px 40px; }
  main:focus { outline: none; }
  .pagehead { display: flex; align-items: flex-end; gap: 16px; margin: 0 0 16px; flex-wrap: wrap; }
  .pagehead h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
  .pagehead p { margin: 2px 0 0; color: var(--text-2); max-width: 920px; }
  .pagehead .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  select { height: 32px; background: var(--panel); color: var(--text); border: 1px solid var(--border-2); border-radius: 4px; padding: 0 8px; font: inherit; }

  /* Panels */
  .grid { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; min-width: 0; display: flex; flex-direction: column; }
  .panel > h2 { margin: 0; padding: 10px 12px 0; font-size: 13px; font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .panel > h2 .hint { margin-left: auto; font: 11px/1.2 var(--mono); color: var(--muted); font-weight: 400; text-align: right; }
  .panel .body { padding: 10px 12px 12px; min-width: 0; flex: 1; }
  .panel .body.flush { padding: 8px 0 0; }
  .s4 { grid-column: span 4; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; } .s16 { grid-column: span 16; } .s24 { grid-column: span 24; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .v { font: 600 30px/1.1 var(--font); letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-decoration: none; }
  .stat .l { color: var(--muted); font-size: 12px; }
  .stat svg { margin-top: 6px; width: 100%; height: 28px; }
  .tone-red { color: var(--red); } .tone-orange { color: var(--orange); } .tone-yellow { color: var(--yellow); } .tone-green { color: var(--green); } .tone-blue { color: var(--blue); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 3px; margin-right: 6px; vertical-align: 3px; border-radius: 2px; }
  .chart text { font: 10px var(--mono); fill: var(--muted); }

  /* Tables */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { text-align: left; font-weight: 500; color: var(--muted); padding: 0 12px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
  thead th button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  thead th button::after { content: "↕"; opacity: .35; font-size: 11px; }
  thead th[aria-sort="ascending"] button::after { content: "↑"; opacity: 1; color: var(--text); }
  thead th[aria-sort="descending"] button::after { content: "↓"; opacity: 1; color: var(--text); }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; }
  tbody tr:hover td { background: var(--panel-2); }
  tbody tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); }
  .sub { color: var(--muted); font-size: 12px; }
  .pager { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; }
  .pager .btn { height: 26px; padding: 0 10px; font-size: 12px; }
  .pager span:first-child { margin-right: auto; }
  .empty { padding: 18px 12px; color: var(--muted); }

  /* Labels */
  .badge { display: inline-flex; align-items: center; gap: 5px; font: 500 11.5px/1 var(--font); padding: 4px 7px; border-radius: 3px; white-space: nowrap; border: 1px solid transparent; }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .b-red { color: var(--red); background: var(--red-bg); } .b-orange { color: var(--orange); background: var(--orange-bg); }
  .b-yellow { color: var(--yellow); background: var(--yellow-bg); } .b-green { color: var(--green); background: var(--green-bg); }
  .b-blue { color: var(--blue); background: var(--blue-bg); } .b-grey { color: var(--text-2); background: var(--panel-2); border-color: var(--border-2); }
  .chip { display: inline-block; font: 12px/1.4 var(--mono); padding: 1px 6px; margin: 2px 4px 2px 0; border-radius: 3px; background: var(--panel-2); border: 1px solid var(--border-2); color: var(--text-2); white-space: nowrap; }
  .chip.regulated { border-color: rgba(242, 73, 92, .5); color: #ff8e9a; }
  .chip.confidential { border-color: rgba(255, 152, 48, .5); color: #ffb870; }
  .chip.needed { border-style: dashed; color: var(--muted); }
  .ask { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .ask + .ask { margin-top: 10px; }
  .ask input[type="text"] { flex: 1 1 280px; min-width: 0; height: 32px; background: var(--bg); color: var(--text); border: 1px solid var(--border-2); border-radius: 4px; padding: 0 10px; font: inherit; }
  .ask input[type="text"]::placeholder { color: var(--muted); }
  .ask select { flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .ask .or { color: var(--muted); font-size: 12px; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #000; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .quick button { font: 12px/1 var(--font); padding: 6px 9px; border-radius: 12px; border: 1px solid var(--border-2); background: var(--bg); color: var(--text-2); cursor: pointer; }
  .quick button:hover { border-color: var(--red); color: var(--text); }
  .outage-head { font: 600 17px/1.4 var(--font); color: var(--text); }
  .feed { list-style: none; margin: 0; padding: 0; }
  .feed li { padding: 8px 0; border-bottom: 1px solid var(--border); display: grid; gap: 4px; }
  .feed li:last-child { border-bottom: 0; }
  .feed button { justify-self: start; background: none; border: 0; padding: 0; color: var(--primary); font: inherit; cursor: pointer; text-align: left; }
  .alert { border-color: rgba(242, 73, 92, .55); background: linear-gradient(0deg, var(--red-bg), var(--red-bg)), var(--panel); }
  .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; min-width: 60px; }
  .bar > span { display: block; height: 100%; border-radius: 3px; }
  .gauge { display: grid; grid-template-columns: minmax(120px, 34%) 1fr max-content; gap: 8px 10px; align-items: center; font-size: 12.5px; }
  .gauge .bar { height: 14px; border-radius: 2px; }
  .gauge .bar > span { border-radius: 2px; }
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .steps li:last-child { border-bottom: 0; }
  .tick { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font: 700 11px/1 var(--mono); border: 1px solid var(--border-2); color: var(--muted); }
  .tick.done { background: var(--green); border-color: var(--green); color: #000; }
  code.cmd { display: block; font: 12px/1.5 var(--mono); background: #000; border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; margin-top: 4px; overflow-wrap: anywhere; color: var(--text-2); }
  .message { padding: 80px 20px; color: var(--text-2); font-size: 15px; }
  .seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 var(--font); padding: 9px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--primary-bg); color: var(--text); box-shadow: inset 0 -2px 0 var(--primary); }
  #cy { height: 640px; background-color: #000; background-image: radial-gradient(#16181c 1px, transparent 1px); background-size: 16px 16px; }
  .graphwrap { position: relative; }
  .graphwrap aside { position: fixed; top: 64px; right: 24px; z-index: 4; width: min(320px, calc(100% - 24px)); max-height: calc(100vh - 88px); overflow: auto;
                     background: rgba(11, 12, 14, .97); border: 1px solid var(--border-2); border-radius: 4px; padding: 12px; box-shadow: 0 8px 24px rgba(0, 0, 0, .6); }
  .graphwrap aside[hidden] { display: none; }
  .graphwrap aside h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; padding-right: 28px; }
  .graphwrap aside .close { position: absolute; top: 8px; right: 8px; height: 24px; width: 24px; padding: 0; }
  .graphtip { position: absolute; left: 12px; top: 12px; font-size: 12px; color: var(--muted); background: rgba(0, 0, 0, .7); padding: 4px 8px; border-radius: 3px; pointer-events: none; }
  .key { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
  .key i { display: inline-block; width: 14px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
  @media (max-width: 980px) { .graphwrap { grid-template-columns: 1fr; } .graphwrap aside { border-left: 0; border-top: 1px solid var(--border); } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
  @media (max-width: 1280px) { .s4 { grid-column: span 8; } .s6 { grid-column: span 12; } }
  @media (max-width: 980px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; height: auto; min-width: 0; }
    .side ul { flex-direction: row; flex-wrap: wrap; }
    .side-foot { display: none; }
    .s4, .s6, .s8 { grid-column: span 12; } .s12, .s16 { grid-column: span 24; }
    .fresh { display: none; }
  }
  @media (max-width: 640px) {
    .s4, .s6, .s8 { grid-column: span 24; }
    main { padding: 14px 12px 32px; }
    .top { height: auto; flex-wrap: wrap; padding: 8px 12px; row-gap: 8px; }
    .search { order: 3; width: 100%; margin-left: 0; }
    #refresh { margin-left: auto; }
    .side ul { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 6px 8px; }
    .side ul::-webkit-scrollbar { display: none; }
    .side a.nav { white-space: nowrap; }
    .pagehead h1 { font-size: 18px; }
    .pagehead .tools { margin-left: 0; flex-wrap: wrap; }
    #cy { height: 440px; }
    .graphwrap aside { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 55vh; border-radius: 8px 8px 0 0; }
    .stat .v { font-size: 26px; }
    .gauge { grid-template-columns: minmax(90px, 40%) 1fr max-content; }
    .tablewrap table { min-width: 720px; }
    tbody td { overflow-wrap: normal; word-break: normal; }
  }
</style>
</head>

<script>
"use strict";
// Plain words for what a node is, and for the data it holds.
const KINDS = { user: "person", group: "group", role: "role", workload: "service", workflow: "CI workflow",
                action: "GitHub Action", entry: "internet", secret: "secret", db: "database", dynamodb: "table",
                sqs: "queue", sns: "topic", logs: "logs", kms: "key" };
const CATEGORIES = { objectstorage: "storage", filestorage: "file share", blockstorage: "disk", database: "database",
                     secret: "secret", encryptionkey: "key", aimodel: "AI model", logstore: "logs",
                     messagequeue: "queue", messagetopic: "topic", datastream: "stream" };
const CLASS = { regulated: ["Regulated", "b-red"], confidential: ["Confidential", "b-orange"],
                internal: ["Internal", "b-blue"], public: ["Public", "b-grey"] };
const TRIGGERS = { push: "push to main", schedule: "nightly run", workflow_dispatch: "manual run", cli: "command line" };
const VERDICT = { blocked: ["Blocked", "b-red"], look: ["Needs a look", "b-yellow"], clear: ["Clear", "b-green"] };
const PROVIDERS = { aws: "AWS", github: "GitHub" };
const STATE = { down: ["Down", "b-red"], impaired: ["Loses access", "b-orange"], degraded: ["Degraded", "b-yellow"], broken: ["Broken", "b-red"] };
const STATE_RANK = { down: 0, broken: 0, impaired: 1, degraded: 2 };
// Severity in words: S0 is the worst, S6 nothing new.
const SEVERITY = ["critical", "high", "medium", "low", "unchecked", "unclear text", "none"];
// A fix's verdict in words, for the tables that name one.
const FIX_WORDS = { pass: "passes", fail: "doesn't pass", invalid: "can't be applied", unknown: "couldn't be checked" };
const FIX = { pass: "b-green", fail: "b-red", invalid: "b-red", unknown: "b-grey" };
const TONES = { red: "#f2495c", orange: "#ff9830", yellow: "#fade2a", green: "#73bf69", blue: "#5794f2", purple: "#b877d9" };
const PAGE = 25;

function timeseries(runs, lines) {

  s.append(title);

        const g = el("a", "Show it on the graph →", { href: "#graph" });
        g.addEventListener("click", () => { GRAPH_MODE = "outage"; });
        links.append(g);
      }
      if (inc.url) links.append(el("a", "Status page ↗", { href: inc.url, target: "_blank", rel: "noopener" }));
      hb.append(links);
      const who = (id) => add(el("div"), el("div", nameOf(id), { class: "mono" }), el("div", kindOf(id, ninfo(id)), { class: "sub" }));
      const [mp, mb] = panel("What runs on it", "s12", { flush: true });
      mb.append(table("What runs on it", [
        { label: "Node", value: (m) => nameOf(m.id), cell: (m) => who(m.id) },
        { label: "State", value: (m) => STATE_RANK[m.state], cell: (m) => stateBadge(m.state) },
        { label: "Why", value: null, cell: (m) => el("span", m.why, { class: "sub" }) },
      ], r.matched, { page: 10, sort: 1, desc: false, empty: "Nothing in this world runs on it.", search: (m) => `${m.id} ${m.why}` }));
      const [fp2, fb2] = panel("Who loses access", "s12", { flush: true });
      fb2.append(table("Who loses access", [
        { label: "Who", value: (m) => nameOf(m.id), cell: (m) => who(m.id) },
        { label: "State", value: (m) => STATE_RANK[m.state], cell: (m) => stateBadge(m.state) },
        { label: "Why", value: null, cell: (m) => el("span", m.why.replace(/(workload|workflow|role|secret|db|user|dynamodb|sqs|sns|log-group):/g, ""), { class: "sub" }) },
      ], r.affected, { page: 10, sort: 1, desc: false, empty: "No one else loses anything they need.", search: (m) => `${m.id} ${m.why}` }));
      const [bp, bb] = panel("Dependencies that break", "s24", { flush: true, hint: "each code call and each access theseus.yaml requires" });
      bb.append(table("Dependencies that break", [
        { label: "Who", value: (b) => nameOf(b.dependency.principal), cell: (b) => who(b.dependency.principal) },
        { label: "Needs", value: (b) => b.dependency.access, cell: (b) => `${b.dependency.access} on` },
        { label: "Data", value: (b) => nameOf(b.dependency.resource), cell: (b) => el("span", nameOf(b.dependency.resource), { class: "mono" }) },
        { label: "State", value: (b) => (b.state === "broken" ? 0 : 1), cell: (b) => stateBadge(b.state) },
        { label: "Because", value: null, cell: (b) => (b.via.length ? add(el("div"), el("span", b.via.length === 1 && [b.dependency.principal, b.dependency.resource].includes(b.via[0]) ? `${nameOf(b.via[0])} is ${b.state === "broken" ? "down" : "degraded"}` : "every route goes through ", { class: "sub" }), b.via.length === 1 && [b.dependency.principal, b.dependency.resource].includes(b.via[0]) ? null : chips(b.via, ninfo)) : el("span", b.why, { class: "sub" })) },
      ], r.broken, { page: 12, sort: 3, desc: false, empty: "Every dependency keeps a route.", search: (b) => `${b.dependency.principal} ${b.dependency.resource} ${b.via.join(" ")}` }));
      out.replaceChildren(stats, grid(hp), grid(mp, fp2), grid(bp));
      $("live").textContent = r.headline;
    }
    if (OUTAGE) show(OUTAGE);
  };

  views.graph = () => {
    head("Graph", posture ? `main's access graph, read from FalkorDB now. Red links are on a path to sensitive data nothing requires; a yellow border is a single point of failure. Click a node to focus on it.` : "main hasn't been scanned yet.");
    if (!posture) return;
    const seg = el("div", null, { class: "seg", role: "group", "aria-label": "What to show" });
    const modes = [["risky", "Risky paths"], ["access", "Access graph"], ["all", "Everything"]];
    if (OUTAGE && OUTAGE.matched.length) modes.push(["outage", "Outage"]);
    const outState = new Map();
    if (OUTAGE) {
      for (const m of OUTAGE.affected) outState.set(m.id, m.state === "degraded" ? 1 : 2);
      for (const m of OUTAGE.matched) outState.set(m.id, m.state === "down" ? 3 : 1);
    }
    for (const [id, label] of modes) seg.append(el("button", label, { type: "button", "data-mode": id, "aria-pressed": id === "access" ? "true" : "false" }));
    const fit = el("button", "Fit", { class: "btn", type: "button" });
    $("tools").append(seg, fit);
    const [gp, gb] = panel("main", "s24", { flush: true, hint: d.main_graph ? `${d.main_graph.name} · ${d.main_graph.nodes} nodes · ${d.main_graph.edges} edges` : "" });
    const wrap = el("div", null, { class: "graphwrap" });
    const canvas = el("div", null, { id: "cy", role: "img", "aria-label": "main's access graph" });
    const side = el("aside", null, { "aria-live": "polite", hidden: "" });
    const tip = el("div", "Click a node for details · scroll or pinch to zoom · drag to pan", { class: "graphtip" });
    wrap.append(canvas, tip, side);
    const key = el("div", null, { class: "key" });
    for (const [label, color] of [["On a risky path", TONES.red], ["Single point of failure", TONES.yellow], ["Sensitive data", "#7a2a35"], ["Other", "#33363c"]]) {
      const i = el("i"); i.style.borderColor = color; key.append(add(el("span"), i, document.createTextNode(label)));
    }
    gb.append(wrap, key);
    $("view").append(grid(gp));
    let graph = null, cy = null;
    const routeOf = (x) => (x.steps.length ? [x.steps[0].from, ...x.steps.map((s) => s.to)] : [x.actor]);
    const hotNodes = new Set(dangerous.flatMap(routeOf));
    const hotEdges = new Set(dangerous.flatMap((x) => x.steps.map((s) => `${s.from}|${s.type}|${s.to}`)));
    const spof = new Map((p ? p.single_points : []).map((s) => [s.id, s]));
    const nodeInfo = (id) => (graph ? graph.byId.get(id) : null) || info(id);
    const sensitive = (id) => ["regulated", "confidential"].includes((nodeInfo(id) || {}).sensitivity);
    function lane(id) {
      const prefix = id.split(":")[0];
      if (["user", "entry", "workflow", "workload", "action"].includes(prefix)) return 0;
      if (prefix === "group") return 1;
      if (prefix === "role") return 2;
      const cat = ((nodeInfo(id) || {}).category || "").toLowerCase();
      return cat === "secret" || cat === "encryptionkey" ? 3 : 4;
    }
    function details(id) {
      const n = nodeInfo(id) || {};
      const close = el("button", "×", { class: "btn close", type: "button", "aria-label": "Close the details" });
      close.addEventListener("click", () => { side.hidden = true; if (cy) cy.elements().removeClass("faded"); });
      side.replaceChildren(close, el("h3", nameOf(id)), el("div", `${kindOf(id, n)} · ${id}`, { class: "sub mono" }));
      side.hidden = false;
      const kv = el("dl", null, { class: "kv", style: "margin-top:10px" });
      const row = (k, v) => add(kv, el("dt", k), v instanceof Node ? add(el("dd"), v) : el("dd", v));
      if (n.sensitivity) row("Class", classBadge(n.sensitivity));
      const reachers = (p ? p.reach : []).filter((r) => r.targets.includes(id)).map((r) => nameOf(r.actor));
      if (reachers.length) row("Reached by", list(reachers));
      const own = (p ? p.reach : []).find((r) => r.actor === id);
      if (own) row("Can reach", chips(own.targets, nodeInfo, (t) => !risky.has(`${id}|${t}`)));
      const s = spof.get(id);
      if (s) row("If it goes", `${plural(s.breaks.length, "dependency", "dependencies")} break for ${list([...new Set(s.breaks.map((b) => nameOf(b.principal)))])}`);
      const out = graph.links.filter((e) => e.src === id).map((e) => `${VERBS[e.type] || e.type}${e.type === "CAN" ? ` ${(e.grants || []).join(" and ")}` : ""} ${nameOf(e.dst)}`);
      const inc = graph.links.filter((e) => e.dst === id).map((e) => `${nameOf(e.src)} ${VERBS[e.type] || e.type}${e.type === "CAN" ? ` ${(e.grants || []).join(" and ")}` : ""} it`);
      if (out.length) row("Links out", add(el("div"), ...out.slice(0, 8).map((x) => el("div", x))));
      if (inc.length) row("Links in", add(el("div"), ...inc.slice(0, 8).map((x) => el("div", x))));
      side.append(kv);
    }
    function draw(mode) {
      for (const b of seg.querySelectorAll("button")) b.setAttribute("aria-pressed", b.dataset.mode === mode ? "true" : "false");
      const access = graph.edges.filter((e) => ACCESS_TYPES.has(e.type));
      const linked = new Set(access.flatMap((e) => [e.src, e.dst]));
      const shown = (id) => mode === "all" || (mode === "risky" ? hotNodes.has(id) : lane(id) < 4 || sensitive(id) || hotNodes.has(id) || outState.has(id));
      const outage = mode === "outage";
      const nodes = graph.nodes.filter((n) => linked.has(n.id) && shown(n.id));
      const keep = new Set(nodes.map((n) => n.id));
      const links = access.filter((e) => keep.has(e.src) && keep.has(e.dst) && (mode !== "risky" || hotEdges.has(`${e.src}|${e.type}|${e.dst}`)));
      graph.links = links;
      const cols = LANES.map(() => []);
      for (const n of nodes) cols[lane(n.id)].push(n.id);
      const pos = new Map(), preds = new Map();
      for (const e of links) { if (!preds.has(e.dst)) preds.set(e.dst, []); preds.get(e.dst).push(e.src); }
      cols.forEach((ids, c) => {
        const weight = (id) => { const from = (preds.get(id) || []).filter((s) => pos.has(s)); return from.length ? from.reduce((sum, s) => sum + pos.get(s).y, 0) / from.length : Infinity; };
        ids.sort((a, b) => (c === 0 ? 0 : weight(a) - weight(b)) || a.localeCompare(b));
        ids.forEach((id, i) => pos.set(id, { x: c * 210, y: i * 56 }));
      });
      const tallest = Math.max(1, ...cols.map((ids) => ids.length));
      cols.forEach((ids) => { const shift = ((tallest - ids.length) * 56) / 2; ids.forEach((id) => { pos.get(id).y += shift; }); });
      // Drawn at a readable size across the panel's width; the canvas grows with the graph, and zoom is there for more.
      const graphW = (LANES.length - 1) * 210 + 150 + 60, graphH = (tallest - 1) * 56 + 40 + 60 + 60;
      const scale = Math.min(1, canvas.clientWidth / graphW);
      canvas.style.height = `${Math.round(Math.min(1800, Math.max(360, graphH * scale)))}px`;
      if (cy) cy.destroy();
      cy = cytoscape({
        container: canvas,
        elements: [
          ...LANES.map((label, i) => ({ data: { id: `lane${i}`, label: label.toUpperCase(), lane: 1 }, position: { x: i * 210, y: -56 } })),
          ...nodes.map((n) => ({ data: { id: n.id, label: `${kindOf(n.id, n)}\n${nameOf(n.id).length > 22 ? nameOf(n.id).slice(0, 21) + "…" : nameOf(n.id)}`, hot: !outage && hotNodes.has(n.id) ? 1 : 0, spof: !outage && spof.has(n.id) ? 1 : 0, sens: sensitive(n.id) ? 1 : 0, out: outage ? outState.get(n.id) || 0 : -1 }, position: pos.get(n.id) })),
          ...links.map((e, i) => ({ data: { id: `e${i}`, source: e.src, target: e.dst, hot: !outage && hotEdges.has(`${e.src}|${e.type}|${e.dst}`) ? 1 : 0, out: outage ? (outState.has(e.src) && outState.has(e.dst) ? 1 : 0) : -1 } })),
        ],
        style: [
          { selector: "node", style: { shape: "round-rectangle", width: 150, height: 40, "background-color": "#0b0c0e", "border-width": 1, "border-color": "#33363c", label: "data(label)", "text-wrap": "wrap", "text-valign": "center", "font-size": 11, "font-family": "Inter, system-ui, sans-serif", color: "#b9bdc5", "text-max-width": 140 } },
          { selector: "node[sens = 1]", style: { "border-color": "#7a2a35", "border-width": 1.5 } },
          { selector: "node[hot = 1]", style: { "border-color": TONES.red, "border-width": 2, color: "#e8e9ec" } },
          { selector: "node[spof = 1]", style: { "border-color": TONES.yellow, "border-width": 2.5, "border-style": "double" } },
          { selector: "node[lane = 1]", style: { "background-opacity": 0, "border-width": 0, "font-size": 11, "font-weight": 600, color: "#8f949d", width: 150, height: 20 } },
          { selector: "edge", style: { width: 1, "line-color": "#33363c", "target-arrow-color": "#33363c", "target-arrow-shape": "triangle", "curve-style": "bezier", "arrow-scale": 0.7 } },
          { selector: "edge[hot = 1]", style: { width: 2.2, "line-color": TONES.red, "target-arrow-color": TONES.red, "z-index": 10 } },
          { selector: "node[out = 0], edge[out = 0]", style: { opacity: 0.3 } },
          { selector: "node[out = 3]", style: { "background-color": "#3a0d14", "border-color": TONES.red, "border-width": 2.5, color: "#ffd6db" } },
          { selector: "node[out = 2]", style: { "background-color": "#2e1a05", "border-color": TONES.orange, "border-width": 2, color: "#ffe2c2" } },
          { selector: "node[out = 1]", style: { "border-color": TONES.yellow, "border-width": 2, "border-style": "dashed" } },
          { selector: "edge[out > 0]", style: { width: 2, "line-color": TONES.orange, "target-arrow-color": TONES.orange } },
          { selector: ".faded", style: { opacity: 0.12 } },
          { selector: "node:selected", style: { "border-color": TONES.blue, "border-width": 3 } },
        ],
        layout: { name: "preset", padding: 30, fit: true },
        wheelSensitivity: 0.25, minZoom: 0.2, maxZoom: 2.5, boxSelectionEnabled: false, autoungrabify: true,
      });
      cy.on("tap", "node", (evt) => {
        const node = evt.target;
        if (node.data("lane")) return;
        const near = node.closedNeighborhood();
        cy.elements().addClass("faded");
        near.removeClass("faded");
        cy.nodes("[lane = 1]").removeClass("faded");
        details(node.id());
      });
      cy.on("tap", (evt) => { if (evt.target === cy) { cy.elements().removeClass("faded"); side.hidden = true; } });
      $("live").textContent = `${nodes.length} nodes and ${links.length} links shown`;
    }
    seg.addEventListener("click", (evt) => { const b = evt.target.closest("button"); if (b && graph) draw(b.dataset.mode); });
    fit.addEventListener("click", () => cy && cy.fit(undefined, 30));
    canvas.append(el("div", "Loading the graph from FalkorDB…", { class: "empty" }));
    Promise.all([fetchJson(`${BASE}/graph`), loadCytoscape()]).then(([g]) => {
      canvas.replaceChildren();
      graph = { ...g, byId: new Map(g.nodes.map((n) => [n.id, n])), links: [] };
      draw(GRAPH_MODE && modes.some(([m]) => m === GRAPH_MODE) ? GRAPH_MODE : graph.nodes.length > 400 ? "risky" : "access");
      GRAPH_MODE = null;
    }).catch(() => { canvas.replaceChildren(el("div", "The graph could not be loaded.", { class: "empty" })); });
  };

  views.setup = () => {
    head("Setup", "What Theseus can see is connected for this repository, and how each part runs.");
    const [sp, sb] = panel("Connection", "s12");
    const steps = el("ul", null, { class: "steps" });
    for (const s of d.onboarding) steps.append(add(el("li"), el("span", s.done ? "✓" : "", { class: `tick ${s.done ? "done" : ""}`, role: "img", "aria-label": s.done ? "done" : "not done" }), add(el("div"), el("div", s.step), el("div", s.detail, { class: "sub" }))));
    sb.append(steps);
    const [rp, rb] = panel("How it runs", "s12");
    const runList = el("ul", null, { class: "steps" });
    for (const [h, text, code] of [
      ["Pull requests", "Every push to a PR that changes the infrastructure is reviewed again. To ask again:", "/theseus review"],
      ["Apply the fix", "Commit Theseus's suggestion on the PR, or, with write access, reply:", "/theseus apply"],
      ["main", "On every push to main, nightly at 03:17 UTC, and from Actions, Theseus main, Run workflow.", "python -m theseus posture <world> <plan>"],
      ["Advisories", "Each scan of main checks the advisory feed, and opens a containment PR when the fix passes.", "python -m theseus finding fixtures/compromised-action"],
    ]) runList.append(add(el("li"), add(el("div"), el("div", h), el("div", text, { class: "sub" }), el("code", code, { class: "cmd" }))));
    rb.append(runList);
    $("view").append(grid(sp, rp));
  };

  shell([
    { id: "overview", label: "Overview", icon: "overview" },
    { id: "prs", label: "Pull requests", icon: "prs", count: blocked, bad: true },
    { id: "findings", label: "Findings", icon: "findings", count: d.findings.length, bad: true },
    { id: "incidents", label: "Incidents", icon: "incidents", count: d.outage && d.outage.live ? d.outage.live.reports.filter((r) => r.matched.length).length : 0, bad: true },
    { id: "access", label: "Who reaches what", icon: "access", count: dangerous.length, bad: true },
    { id: "weak", label: "Weak points", icon: "weak" },
    { id: "graph", label: "Graph", icon: "graph" },
    { id: "cost", label: "Cost", icon: "cost" },
    { id: "setup", label: "Setup", icon: "setup" },
  ], [{ label: d.org, href: d.org_url }, { label: d.repo.split("/")[1] }], posture ? `main@${posture.sha.slice(0, 7)} · ${ago(posture.updated_at)}` : null);
  const g = d.main_graph;
  $("sidefoot").replaceChildren(el("div", "Graph in FalkorDB"), el("b", g ? `${g.nodes.toLocaleString()} nodes · ${g.edges.toLocaleString()} edges` : "not built yet"));
  return views;
}

// The whole organisation -----------------------------------------------------------------------------------
function orgViews(d) {
  const t = d.totals;
  const scanned = d.repos.filter((r) => r.scanned);
  const views = {};
  const repoTable = (page) => table("Repositories", [
    { label: "Repository", value: (r) => r.repo, cell: (r) => add(el("div"), r.url ? el("a", r.repo.split("/")[1], { href: r.url }) : el("span", r.repo), el("div", r.scanned ? `main@${r.sha.slice(0, 7)} · ${ago(r.updated_at)}` : "not scanned yet", { class: "sub mono", style: "white-space:nowrap" })) },
    { label: "Dangerous paths", value: (r) => r.dangerous || 0, num: true, cell: (r) => el("span", r.scanned ? String(r.dangerous) : "–", { class: r.dangerous ? "tone-red" : "" }) },
    { label: "Regulated data", value: (r) => r.regulated || 0, num: true, cell: (r) => (r.scanned ? String(r.regulated) : "–") },
    { label: "Blocked PRs", value: (r) => r.reviews.blocked, num: true, cell: (r) => `${r.reviews.blocked}/${r.reviews.blocked + r.reviews.look + r.reviews.clear}` },
    { label: "Advisories", value: (r) => (r.findings || []).length, num: true, cell: (r) => (r.scanned ? String(r.findings.length) : "–") },
    { label: "Single points", value: (r) => r.single_points || 0, num: true, cell: (r) => (r.scanned ? String(r.single_points) : "–") },
    { label: "Nodes / edges", value: (r) => r.nodes || 0, num: true, cell: (r) => (r.scanned ? `${r.nodes.toLocaleString()} / ${r.edges.toLocaleString()}` : "–") },
    { label: "Cost / month", value: (r) => r.monthly_usd || 0, num: true, cell: (r) => (r.scanned ? usd(r.monthly_usd) : "–") },
    { label: "Trend", value: null, cell: (r) => { const s = sparkline((r.history || []).map((h) => h.dangerous), TONES.red); s.style.width = "90px"; s.style.height = "22px"; return s; } },
  ], d.repos, { page, sort: 1, empty: "No repository is connected yet.", search: (r) => r.repo });

  views.overview = () => {
    head(d.org, `${plural(t.repos, "repository", "repositories")} connected, ${t.scanned} scanned. Each repository's main is its own graph in FalkorDB, rebuilt on every push and every night; this page adds them up.`);
    const daily = (key) => {
      const byDay = new Map();
      for (const r of scanned) for (const h of r.history || []) { const day = h.at.slice(0, 10); byDay.set(day, (byDay.get(day) || 0) + (h[key] || 0)); }
      return [...byDay.entries()].sort().map(([, v]) => v);
    };
    const stats = grid(
      statPanel("Dangerous paths", t.dangerous, `across ${plural(t.scanned, "repository", "repositories")}`, t.dangerous ? "red" : "green", daily("dangerous"), "#repos"),
      statPanel("Regulated data", t.regulated, "paths to regulated data", t.regulated ? "red" : "green", null),
      statPanel("Pull requests", `${t.blocked}/${t.reviewed}`, "blocked from merging", t.blocked ? "orange" : "green", null),
      statPanel("Advisories", t.findings, "affect a workflow on main", t.findings ? "red" : "green", daily("findings")),
      statPanel("Graph size", t.nodes.toLocaleString(), `nodes and ${t.edges.toLocaleString()} edges in FalkorDB`, "blue", null),
      statPanel("Monthly cost", usd(t.monthly_usd), "estimated at list price", "blue", daily("monthly_usd")),
    );
    const [rp, rb] = panel("Repositories", "s24", { flush: true, hint: "riskiest first; open one for its own dashboard" });
    rb.append(repoTable(10));
    const top = scanned.flatMap((r) => (r.top || []).map((x) => ({ ...x, repo: r.repo, url: r.url })));
    const [tp, tb] = panel("Top risks across the organisation", "s24", { flush: true, hint: "the riskiest paths of each repository" });
    tb.append(table("Top risks across the organisation", [
      { label: "Repository", value: (x) => x.repo, cell: (x) => (x.url ? el("a", x.repo.split("/")[1], { href: `${x.url}#access` }) : x.repo) },
      { label: "Who", value: (x) => nameOf(x.actor), cell: (x) => nameOf(x.actor) },
      { label: "Could reach", value: (x) => nameOf(x.target), cell: (x) => el("span", nameOf(x.target), { class: "mono" }) },
      { label: "Class", value: (x) => (x.sensitivity === "regulated" ? 0 : 1), cell: (x) => classBadge(x.sensitivity) },
      { label: "Hops", value: (x) => x.hops, num: true, cell: (x) => String(x.hops) },
    ], top, { page: 10, sort: 3, desc: false, empty: "Nothing reaches sensitive data it doesn't need.", search: (x) => `${x.repo} ${x.actor} ${x.target}` }));
    $("view").append(stats, grid(rp), grid(tp));
  };
  views.repos = () => {
    head("Repositories", "Every repository connected to Theseus. Search, sort and open one.");
    const [rp, rb] = panel("Repositories", "s24", { flush: true });
    rb.append(repoTable(PAGE));
    $("view").append(grid(rp));
  };
  shell([
    { id: "overview", label: "Overview", icon: "overview" },
    { id: "repos", label: "Repositories", icon: "repos", count: t.repos },
  ], [{ label: d.org }], `${t.scanned}/${t.repos} scanned`);
  $("sidefoot").replaceChildren(el("div", "Graphs in FalkorDB"), el("b", `${t.nodes.toLocaleString()} nodes · ${t.edges.toLocaleString()} edges`));
  return views;
}

// Start --------------------------------------------------------------------------------------------------
async function load() {
  let data;
  try { data = await fetchJson(`${BASE}/data`); }
  catch (e) {
    head("Not found", "");
    $("view").replaceChildren(el("p", "This link doesn't open a dashboard. It may be mistyped or out of date.", { class: "message" }));
    return;
  }
  const views = ORG ? orgViews(data) : repoViews(data);
  renderView = () => route(views, "overview");
  renderView();
}
let timer = null;
$("q").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => TABLES.forEach((tbl) => tbl.redraw()), 200); });
$("refresh").addEventListener("click", () => load());
window.addEventListener("hashchange", () => { $("q").value = ""; renderView(); $("content").focus({ preventScroll: true }); });
load();
</script>
</body>
