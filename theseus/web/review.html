<title>Theseus review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #000000; --dot: #16181c; --card: #0b0c0e; --card-2: #121418; --text: #e8e9ec; --muted: #9a9fa8;
    --faint: #5c6068; --line: #24262b; --tile-line: #33363c; --accent: #f2495c; --accent-bg: rgba(242, 73, 92, .14);
    --accent-soft: #7a2a35; --ok: #73bf69; --ok-bg: rgba(115, 191, 105, .14); --warn: #fade2a;
    --warn-bg: rgba(250, 222, 42, .12); --chip: #16181c; --primary: #6e9fff; --primary-bg: rgba(87, 148, 242, .16);
    --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: "Roboto Mono", ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); background: var(--bg); font: 14.5px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }
  .skip { position: absolute; left: 8px; top: -40px; background: var(--primary); color: #000; padding: 8px 12px; border-radius: 4px; z-index: 10; font-weight: 600; }
  .skip:focus { top: 8px; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 24px; }
  header { position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--line); background: rgba(0, 0, 0, .92); backdrop-filter: blur(6px); }
  header .wrap { display: flex; align-items: center; gap: 14px; height: 52px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; }
  .brand svg { width: 22px; height: 22px; }
  .where { color: var(--muted); font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; padding-left: 14px; border-left: 1px solid var(--line); }
  .badge { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--font); padding: 6px 9px;
           border-radius: 3px; white-space: nowrap; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .badge.blocked { color: var(--accent); background: var(--accent-bg); }
  .badge.look { color: var(--warn); background: var(--warn-bg); }
  .badge.clear { color: var(--ok); background: var(--ok-bg); }
  .dash { height: 32px; display: inline-flex; align-items: center; padding: 0 12px; border: 1px solid var(--tile-line); border-radius: 4px;
          background: var(--card-2); font: 500 13px/1 var(--font); color: var(--text); text-decoration: none; white-space: nowrap; }
  .dash:hover { border-color: var(--muted); }

  .hero { padding: 36px 0 8px; }
  .hero h1 { font-size: 26px; font-weight: 600; line-height: 1.25; letter-spacing: -.02em; margin: 0 0 10px; max-width: 980px; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin: 0; color: var(--muted); font-size: 16px; max-width: 820px; }

  .board { margin: 24px 0 8px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
           background-color: var(--bg);
           background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 16px 16px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line);
         background: var(--card); flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--tile-line); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--font);
                padding: 8px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--primary-bg); color: var(--text); box-shadow: inset 0 -2px 0 var(--primary); }
  .bar .note { color: var(--muted); font-size: 13px; }
  .stage { position: relative; overflow-x: auto; padding: 28px 24px 24px; }
  .canvas { position: relative; margin: 0 auto; }
  .canvas > svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }

  .tile { position: absolute; width: 132px; height: 92px; border: 1px solid var(--tile-line); border-radius: 4px;
          background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 4px; padding: 6px 8px; text-align: center; transition: opacity .2s, border-color .2s; }
  .tile svg.icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6;
                   stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
  .tile .kind { font: 11px/1 var(--mono); color: var(--muted); }
  .tile .svc { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; }
  .tile .svc svg { width: 18px; height: 18px; stroke: #fff; fill: none; stroke-width: 1.8;
                   stroke-linecap: round; stroke-linejoin: round; }
  .tile .name { font-size: 12.5px; font-weight: 600; line-height: 1.2; max-width: 116px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .tile.exposed { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .tile.exposed svg.icon, .tile.exposed .kind { color: var(--accent); }
  .tile.actor { border-color: var(--text); }
  .tile.off { opacity: .38; }
  .tag { position: absolute; font: 600 11.5px/1.3 var(--mono); padding: 4px 7px; border-radius: 4px; white-space: nowrap;
         background: var(--accent); color: #000; }
  .tag.quiet { background: var(--chip); color: var(--muted); }
  .tag.ok { background: var(--ok); color: #000; }
  .edge-label { font: 11px/1 var(--mono); fill: var(--muted); paint-order: stroke; stroke: var(--bg);
                stroke-width: 5px; stroke-linejoin: round; }
  .edge-label.new { fill: var(--accent); font-weight: 700; }

  section { padding: 28px 0 8px; }
  section h2 { font-size: 14px; font-weight: 600; color: var(--text); margin: 0 0 12px; }
  .ways { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .way { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
  .way h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
  .way .sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .way ol { margin: 0; padding-left: 20px; }
  .way li { margin: 4px 0; font-size: 14px; overflow-wrap: anywhere; }
  .way li .src { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 6px; }
  .way li .src a { color: var(--muted); }
  .chip { display: inline-block; font: 600 11px/1 var(--mono); padding: 3px 6px; border-radius: 4px; margin-left: 6px;
          background: var(--accent); color: #000; vertical-align: 1px; }
  .chip.ok { background: var(--ok); }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 12px 16px; }
  details summary { cursor: pointer; font-weight: 600; }
  details ul { margin: 10px 0 0; padding-left: 20px; color: var(--muted); }
  #full { min-height: 360px; }
  #fixgraph { min-height: 360px; }
  .fixops { padding: 12px 16px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--muted); }
  .fixops ul { margin: 6px 0 0; padding-left: 18px; color: var(--text); }
  .fixops li { margin: 3px 0; overflow-wrap: anywhere; }
  .fixops code { font-family: var(--mono); font-size: 12.5px; }
  footer { padding: 28px 0 40px; color: var(--muted); font-size: 13px; }
  .message { padding: 80px 0; color: var(--muted); font-size: 16px; }
  .message button { margin-left: 12px; height: 32px; padding: 0 12px; border: 1px solid var(--tile-line); border-radius: 4px;
                    background: var(--card-2); color: var(--text); font: 500 13px/1 var(--font); cursor: pointer; }
  .message button:hover { border-color: var(--muted); }
  .todo-actions { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
  .todo-actions code, .way code { font-family: var(--mono); font-size: 12.5px; color: var(--text); }
  .todo-actions button { height: 30px; padding: 0 11px; border: 1px solid var(--tile-line); border-radius: 4px;
                         background: var(--card-2); color: var(--text); font: 500 13px/1 var(--font); cursor: pointer; }
  .todo-actions button:hover { border-color: var(--muted); }
  .way ul.ops { margin: 0 0 4px; padding-left: 18px; }
  .way ul.ops li { margin: 3px 0; }
  .badge[hidden], .dash[hidden] { display: none; }
  .skeleton { padding-top: 8px; }
  .skeleton .line, .skeleton .block { border-radius: 4px; background: var(--card-2); }
  .skeleton .line { height: 14px; margin: 14px 0; }
  .skeleton .line.big { height: 28px; width: min(720px, 90%); margin-top: 36px; }
  .skeleton .line.mid { width: min(520px, 70%); }
  .skeleton .block { height: 300px; margin-top: 24px; border: 1px solid var(--line); }
  .skeleton .status { color: var(--muted); font-size: 13px; margin-top: 12px; }
  @media (prefers-reduced-motion: no-preference) {
    .skeleton .line, .skeleton .block { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .45; } }
  }
  @media (max-width: 720px) {
    .wrap { padding: 0 16px; }
    header .wrap { height: auto; flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; row-gap: 6px; }
    .where { order: 3; width: 100%; border-left: 0; padding-left: 0; font-size: 12px; }
    .bar { gap: 8px; }
    .seg button { padding: 8px 10px; }
    .hero h1 { font-size: 24px; }
    .stage { padding: 20px 12px; }
  }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header><div class="wrap">
  <span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="#686d76" stroke-width="1.2" stroke-linejoin="round"><polygon points="16,4 26.39,10 26.39,22 16,28 5.61,22 5.61,10"/><polygon points="16,9 22.06,12.5 22.06,19.5 16,23 9.94,19.5 9.94,12.5"/><path d="M16 16L16 4M16 16L26.39 10M16 16L26.39 22M16 16L16 28M16 16L5.61 22M16 16L5.61 10"/></g><g fill="#9a9fa8"><circle cx="16" cy="4" r="1.4"/><circle cx="26.39" cy="10" r="1.4"/><circle cx="26.39" cy="22" r="1.4"/><circle cx="16" cy="28" r="1.4"/><circle cx="5.61" cy="10" r="1.4"/></g><path d="M5.61 22L5.61 10L16 16" fill="none" stroke="#6e9fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5.61" cy="22" r="2" fill="#6e9fff"/><circle cx="16" cy="16" r="3.2" fill="#f2495c"/></svg>Theseus</span>
  <span class="where" id="where"></span>
  <span class="badge" id="badge" hidden></span>
  <a class="dash" id="ghpr" hidden target="_blank" rel="noopener">Open PR on GitHub</a>
  <a class="dash" id="dash" hidden>Dashboard</a>
</div></header>

<div class="wrap skeleton" id="loading" role="status" aria-live="polite">
  <div class="line big"></div>
  <div class="line mid"></div>
  <div class="block"></div>
  <p class="status" id="loading-status">Reading the review from FalkorDB…</p>
</div>

<main class="wrap" id="main" hidden>
  <div class="hero">
    <h1 id="title"></h1>
    <p id="lede"></p>
  </div>

  <div class="board">
    <div class="bar">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="v-before" aria-pressed="false">Today</button>
        <button type="button" id="v-after" aria-pressed="true">If merged</button>
        <button type="button" id="v-full" aria-pressed="false">Whole graph</button>
      </div>
      <span class="note" id="note"></span>
    </div>
    <div class="stage" id="stage"><div class="canvas" id="canvas"></div></div>
    <div id="full" hidden></div>
    <div id="fixgraph" hidden></div>
    <div class="fixops" id="fixops" hidden></div>
  </div>

  <section id="todo-section" hidden>
    <h2>What to do</h2>
    <div class="ways" id="todo"></div>
  </section>

  <section id="steps-section">
    <h2>Step by step</h2>
    <div class="ways" id="ways"></div>
  </section>

  <section id="already-section" hidden>
    <details>
      <summary id="already-title"></summary>
      <ul id="already"></ul>
    </details>
  </section>
</main>

<div class="wrap"><footer id="footer"></footer></div>

<script>
"use strict";
const CYTOSCAPE = { src: "https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js",
  integrity: "sha512-EY3U1MWdgKx0P1dqTE4inlKz2cpXtWpsR1YUyD855Hs6RL/A0cyvrKh60EpE8wDZ814cTe1KgRK+sG0Rn792vQ==" };

// Short words for a tile: what a thing is.
const KINDS = { user: "user", group: "group", role: "role", workload: "service", workflow: "CI workflow",
                action: "GitHub Action", entry: "internet" };
const CATEGORIES = { objectstorage: "storage", filestorage: "file share", blockstorage: "disk", database: "database",
                     secret: "secret", encryptionkey: "key", aimodel: "AI model", logstore: "logs",
                     messagequeue: "queue", messagetopic: "topic", datastream: "stream" };
// What the data is, for people outside security.
const HOLDS = { regulated: "personal, payment or health data", confidential: "business data",
                internal: "internal data", public: "public data" };
const TAGS = { regulated: "Regulated data", confidential: "Confidential data" };
const VERBS = { MEMBER_OF: "is in", CAN_ASSUME: "can become", TRUSTS: "can log in as", RUNS_AS: "runs as",
                UNLOCKS: "opens", USES: "uses", CALLS: "calls", REQUESTS: "calls", HAS_ENV: "is configured with",
                RUNS_IN: "runs in" };
const RANK = { regulated: 0, confidential: 1 };

// Line icons, drawn here: no data ever reaches them.
const ICONS = {
  user: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0",
  group: "M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 6.5M18 13.5a6.5 6.5 0 0 1 3.5 6.5",
  role: "M4 5h16v14H4zM8 10h3M8 14h8M15 10h1",
  secret: "M15 7a4 4 0 1 1-3.9 5H4v3h3v3h3v-3h1.1A4 4 0 0 1 15 7zM15 10.5h.01",
  database: "M4 6c0 1.7 3.6 3 8 3s8-1.3 8-3-3.6-3-8-3-8 1.3-8 3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3",
  storage: "M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10",
  service: "M12 2l8.5 5v10L12 22l-8.5-5V7z",
  "CI workflow": "M5 4l14 8-14 8z",
  "GitHub Action": "M13 2L4 14h7l-1 8 9-12h-7z",
  internet: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18",
  logs: "M6 3h9l3 3v15H6zM9 9h6M9 13h6M9 17h4",
  queue: "M3 6h18M3 12h18M3 18h12",
  topic: "M4 12a8 8 0 0 1 16 0M8 12a4 4 0 0 1 8 0M12 12v8",
  other: "M5 5h14v14H5z",
};

const $ = (id) => document.getElementById(id);
function el(tag, text, attrs) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = text;
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}
function svg(tag, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}

function nameOf(id) {
  if (id === "entry:internet") return "anyone on the internet";
  const url = id.indexOf("://");
  if (url >= 0) return id.slice(url + 3);
  const i = id.indexOf(":");
  return i < 0 ? id : id.slice(i + 1);
}
// The service each node is, coloured by its AWS architecture category, with a plain glyph: identity and
// secrets red, storage green, databases purple, compute orange, messaging pink, CI neutral.
const SERVICES = {
  user: ["IAM user", "#DD344C", "user"], group: ["IAM group", "#DD344C", "group"], role: ["IAM role", "#DD344C", "role"],
  secret: ["Secrets Manager", "#DD344C", "secret"], kms: ["KMS key", "#DD344C", "secret"],
  db: ["RDS", "#C925D1", "database"], dynamodb: ["DynamoDB", "#C925D1", "database"],
  sqs: ["SQS", "#E7157B", "queue"], sns: ["SNS", "#E7157B", "topic"], logs: ["CloudWatch Logs", "#E7157B", "logs"],
  workload: ["Lambda / ECS", "#ED7100", "service"], workflow: ["GitHub Actions", "#24292F", "CI workflow"],
  action: ["GitHub Action", "#24292F", "GitHub Action"], entry: ["Internet", "#5C6068", "internet"],
};
function serviceOf(id, info) {
  if (id.startsWith("s3://")) return ["S3", "#7AA116", "storage"];
  const prefix = id.split(":")[0];
  if (SERVICES[prefix]) return SERVICES[prefix];
  return [kindOf(id, info), "#5C6068", kindOf(id, info)];
}
function kindOf(id, info) {
  const prefix = id.split(":")[0];
  if (KINDS[prefix]) return KINDS[prefix];
  const cat = ((info && info.category) || "").toLowerCase().replace(/_/g, "");
  return CATEGORIES[cat] || "data";
}
function plural(n, word) { return `${n} ${n === 1 ? word : word + "s"}`; }
function add(parent, ...kids) { for (const k of kids) if (k) parent.append(k); return parent; }
function short(id) {
  // A storage location reads best as its folder; the full name is in the tooltip.
  const full = nameOf(id), folder = full.endsWith("/");
  const parts = full.replace(/\/$/, "").split("/");
  return parts[parts.length - 1] + (folder && parts.length > 1 ? "/" : "");
}
function access(grants) {
  const g = (grants || []).filter((x) => x === "read" || x === "write").sort();
  return g.length === 2 ? "read and change" : g[0] === "write" ? "change" : g[0] === "read" ? "read" : "reach";
}
function verb(step) { return step.type === "CAN" ? `can ${access(step.grants)}` : VERBS[step.type] || step.type.toLowerCase(); }
function rank(p) {
  const last = p.steps.length ? p.steps[p.steps.length - 1].type : "";
  return [RANK[p.sensitivity] ?? 2, last === "UNLOCKS" ? 0 : 1, p.steps.length, p.id];
}
function byRank(a, b) {
  const x = rank(a), y = rank(b);
  for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
  return 0;
}
function list(items) {
  if (items.length <= 1) return items.join("");
  return `${items.slice(0, -1).join(", ")} and ${items[items.length - 1]}`;
}

function fail(text, retry) {
  $("loading").hidden = true;
  $("main").hidden = true;
  const message = el("p", text, { class: "message" });
  if (retry) {
    const again = el("button", "Try again", { type: "button" });
    again.addEventListener("click", () => { $("footer").replaceChildren(); $("loading").hidden = false; main(); });
    message.append(again);
  }
  $("footer").replaceChildren(message);
}

// A slow answer shows the skeleton and then says so; no answer at all ends in a message with a way to retry.
const SLOW_MS = 6000, GIVE_UP_MS = 60000;
async function main() {
  const k = new URLSearchParams(location.search).get("k") || "";
  const status = $("loading-status");
  status.textContent = "Reading the review from FalkorDB…";
  const slow = setTimeout(() => { status.textContent = "Still reading the graph from FalkorDB. This is taking longer than usual…"; }, SLOW_MS);
  const controller = new AbortController();
  const giveUp = setTimeout(() => controller.abort(), GIVE_UP_MS);
  let data;
  try {
    const res = await fetch(`${location.pathname.replace(/\/$/, "")}/data?k=${encodeURIComponent(k)}`, { cache: "no-store", signal: controller.signal });
    if (res.status === 404) {
      fail("This link doesn't open a review. It may be mistyped, or the PR hasn't been reviewed yet.", false);
      return;
    }
    if (!res.ok) throw new Error(String(res.status));
    data = await res.json();
  } catch (e) {
    fail("Theseus couldn't read this review just now. The graph store may be slow or busy.", true);
    return;
  } finally {
    clearTimeout(slow);
    clearTimeout(giveUp);
  }
  render(data);
}

function render(data) {
  const r = data.result;
  const info = (id) => (r.nodes || {})[id] || {};
  const changed = new Set((r.changes || []).map((c) => c.address));
  const isNew = (step) => { const ev = (r.evidence || {})[step.evidence]; return !!ev && changed.has(ev.address); };
  const opened = [...r.opened].sort(byRank);
  const already = [...(r.unchanged || [])].sort(byRank);
  // A PR that opens nothing but whose code now reads sensitive data: draw the route that code uses. The
  // access was there before; what is new is the code using it.
  const codeUse = r.opened.length ? [] : r.use_beyond_intent || [];
  const codeRoutes = codeUse.flatMap((u) => already.filter((p) => p.actor === u.workload && p.target === u.resource).slice(0, 1));
  const drawn = opened.length ? opened : codeRoutes;
  const codeMode = !opened.length && codeRoutes.length > 0;
  const finding = r.mode === "finding";
  const advisory = r.finding || {};
  const actionId = advisory.action || "";
  const cut = r.min_cut && r.min_cut.cuttable ? r.min_cut.cut || [] : [];
  const cutKeys = new Set(cut.map((c) => `${c.src}|${c.type}|${c.dst}`));
  const rotate = new Set(r.rotate || []);
  const marked = (step) => (finding ? cutKeys.has(`${step.from}|${step.type}|${step.to}`) : codeMode || isNew(step));

  document.title = finding ? `${advisory.id} · Theseus` : `${data.repo} #${data.number} · Theseus`;
  $("where").textContent = finding ? `${advisory.id} · ${data.repo}` : `${data.repo} #${data.number} · ${data.head_sha.slice(0, 7)}`;
  const badge = $("badge");
  badge.hidden = false;
  badge.className = `badge ${data.verdict.level}`;
  badge.textContent = (finding ? { blocked: "At risk", look: "Needs a look", clear: "Not exposed" }
    : { blocked: "Merge blocked", look: "Needs a look", clear: "Safe to merge" })[data.verdict.level];
  if (data.dashboard) { const dash = $("dash"); dash.href = data.dashboard; dash.hidden = false; }
  if (!finding && data.repo && data.number) {
    const pr = $("ghpr");
    pr.href = `https://github.com/${data.repo.split("/").map(encodeURIComponent).join("/")}/pull/${encodeURIComponent(data.number)}`;
    pr.textContent = `PR #${data.number} on GitHub`;
    pr.hidden = false;
  }
  $("loading").hidden = true;
  $("main").hidden = false;

  // The finding, in one sentence and one line under it.
  const title = $("title"), lede = $("lede");
  const intent = r.intent;
  const asked = intent && intent.stated
    ? (intent.grants || []).map((g) => `${g.access === "write" ? "change" : g.access === "assume" ? "become" : "read"} ${nameOf(g.resource)}`)
    : [];
  const askedLine = !intent ? "" : !intent.stated ? " The PR doesn't say what it's for."
    : asked.length ? ` The PR only asked to ${list(asked)}.` : " The PR says it changes no access.";
  if (finding) {
    const flows = advisory.workflows || [];
    const action = nameOf(actionId);
    if (opened.length) {
      const top = opened[0];
      title.append(`If ${action} is compromised, ${short(top.actor)} could ${access(top.grants)} `);
      title.append(el("em", nameOf(top.target)));
      title.append(".");
    } else {
      title.textContent = `If ${action} is compromised, it reaches no sensitive data.`;
    }
    const parts = [`${flows.length} ${flows.length === 1 ? "workflow uses" : "workflows use"} it at an affected version: ${list(flows.map(short))}.`];
    if (rotate.size) parts.push(`Rotate ${list([...rotate].map(nameOf))} now.`);
    if (cut.length) parts.push(cut.length === 1 ? "Cutting one link contains it." : `Cutting ${cut.length} links contains it.`);
    lede.textContent = parts.join(" ");
  } else if (opened.length) {
    const top = opened[0];
    title.append(`This PR would let ${nameOf(top.actor)} ${access(top.grants)} `);
    title.append(el("em", nameOf(top.target)));
    title.append(".");
    lede.textContent = `${nameOf(top.target)} holds ${HOLDS[top.sensitivity] || "data Theseus can't classify"}.${askedLine}`;
  } else if ((r.use_beyond_intent || []).length) {
    const use = r.use_beyond_intent[0];
    title.textContent = `This PR would make ${nameOf(use.workload)}'s code read ${nameOf(use.resource)}.`;
    lede.textContent = `${askedLine.trim()} See ${use.file}:${use.line}.`.trim();
  } else if ((r.unknowns || []).length) {
    title.textContent = "Part of this change couldn't be checked.";
    lede.textContent = r.unknowns.slice(0, 3).join(" · ");
  } else {
    title.textContent = "No new access to sensitive data.";
    lede.textContent = askedLine.trim();
  }

  // The picture: one row per way in, left to right, the way access flows.
  const COL = 216, ROW = 132, W = 132, H = 92, PAD = 28;
  const place = new Map(), used = new Map();
  let rows = 0;
  const routeOf = (p) => (p.steps.length ? [p.steps[0].from, ...p.steps.map((s) => s.to)] : [p.actor]);
  const lead = finding && actionId ? [actionId] : [];
  const quiet = finding ? (advisory.workflows || []).filter((w) => !opened.some((p) => p.actor === w)) : [];
  const routes = [...drawn.map((p) => [...lead, ...routeOf(p)]), ...quiet.map((w) => [...lead, w])];
  for (const route of routes) {
    let row = null;
    route.forEach((id, col) => {
      if (place.has(id)) { row = place.get(id).row; return; }
      const taken = used.get(col) || new Set();
      let r0 = row === null ? 0 : row;
      while (taken.has(r0)) r0++;
      taken.add(r0); used.set(col, taken);
      place.set(id, { col, row: r0 });
      row = r0; rows = Math.max(rows, r0 + 1);
    });
  }
  const edges = new Map();
  if (lead.length) for (const w of advisory.workflows || []) {
    edges.set(`${actionId}|RUNS_IN|${w}`, { step: { from: actionId, type: "RUNS_IN", to: w, evidence: null }, fresh: false });
  }
  for (const p of drawn) for (const s of p.steps) {
    const key = `${s.from}|${s.type}|${s.to}`;
    if (!edges.has(key)) edges.set(key, { step: s, fresh: marked(s) });
  }
  // Past a step this PR adds, nothing was reachable before it. A route the code starts using was there.
  const outOfReach = new Set();
  for (const p of codeMode ? [] : drawn) {
    const i = p.steps.findIndex(marked);
    p.steps.slice(i < 0 ? p.steps.length - 1 : i).forEach((s) => outOfReach.add(s.to));
    if (!p.steps.length) outOfReach.add(p.target);
  }
  const exposed = new Set(drawn.map((p) => p.target));
  // A secret that opens another exposed target is tagged by what it opens.
  const keyTo = new Map();
  for (const p of drawn) for (const s of p.steps) if (s.type === "UNLOCKS" && exposed.has(s.to)) keyTo.set(s.from, s.to);
  const cols = Math.max(1, ...[...place.values()].map((v) => v.col + 1));

  let shown = "after";
  function drawBoard(mode) {
    shown = mode;
    const fix = mode.startsWith("fix:") ? mode.slice(4) : null;
    $("stage").hidden = mode === "full" || !!fix;
    $("full").hidden = mode !== "full";
    $("fixgraph").hidden = !fix;
    $("fixops").hidden = !fix;
    for (const id of ["before", "after", "full"]) $(`v-${id}`).setAttribute("aria-pressed", String(mode === id));
    for (const b of document.querySelectorAll("button[data-fix]")) b.setAttribute("aria-pressed", String(b.dataset.fix === fix));
    if (mode === "full") { drawFull(); return; }
    if (fix) { drawFix(fix); return; }
    const canvas = $("canvas");
    canvas.replaceChildren();
    if (!drawn.length) {
      canvas.style.width = "auto"; canvas.style.height = "auto";
      canvas.append(el("p", "Nothing new to draw: this PR opens no way in to sensitive data.", { class: "note" }));
      $("note").textContent = "";
      return;
    }
    const before = mode === "before";
    const width = cols * COL - (COL - W) + PAD * 2, height = rows * ROW - (ROW - H) + PAD * 2 + 30;
    canvas.style.width = `${width}px`; canvas.style.height = `${height}px`;
    const layer = svg("svg", { width, height, viewBox: `0 0 ${width} ${height}` });
    const defs = svg("defs");
    for (const [id, color] of [["arrow", "var(--faint)"], ["arrow-new", finding ? "var(--ok)" : "var(--accent)"]]) {
      const m = svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
      m.append(svg("path", { d: "M0 0L10 5L0 10z", fill: color }));
      defs.append(m);
    }
    layer.append(defs);
    canvas.append(layer);
    const at = (id) => { const p = place.get(id); return { x: PAD + p.col * COL, y: PAD + 30 + p.row * ROW }; };

    for (const { step, fresh } of edges.values()) {
      const a = at(step.from), b = at(step.to);
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x - 2, y2 = b.y + H / 2, dx = (x2 - x1) / 2;
      const hot = fresh && !before;
      const path = svg("path", { d: `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`, fill: "none",
                                 stroke: hot ? (finding ? "var(--ok)" : "var(--accent)") : "var(--faint)", "stroke-width": hot ? 2.5 : 1.4,
                                 "marker-end": `url(#${hot ? "arrow-new" : "arrow"})` });
      if (fresh && before) path.setAttribute("stroke-dasharray", "5 5");
      layer.append(path);
      const label = svg("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 8, "text-anchor": "middle",
                                  class: `edge-label${hot ? " new" : ""}` });
      label.textContent = fresh && before ? (finding ? "cut" : "not there today") : verb(step);
      if (hot && finding) label.style.fill = "var(--ok)";
      layer.append(label);
    }

    for (const [id, p] of place) {
      const pos = at(id);
      const kind = kindOf(id, info(id));
      const tile = el("div", null, { class: "tile", title: id });
      tile.style.left = `${pos.x}px`; tile.style.top = `${pos.y}px`;
      const [service, color, glyph] = serviceOf(id, info(id));
      const badge = el("div", null, { class: "svc", "aria-hidden": "true" });
      badge.style.background = color;
      const icon = svg("svg", { viewBox: "0 0 24 24" });
      icon.append(svg("path", { d: ICONS[glyph] || ICONS[kind] || ICONS.other }));
      badge.append(icon);
      tile.append(badge, el("div", service, { class: "kind" }), el("div", short(id), { class: "name" }));
      const sens = info(id).sensitivity;
      if (p.col === 0) tile.classList.add("actor");
      if (before && outOfReach.has(id)) tile.classList.add("off");
      else if (exposed.has(id) || sens === "regulated" || sens === "confidential") tile.classList.add("exposed");
      canvas.append(tile);
      // A tag over the data this PR exposes, the way a reviewer would say it.
      const away = finding ? "Out of reach once cut" : "Out of reach today";
      let tagText = null, tagClass = "tag";
      if (id === actionId) tagText = "Compromised";
      else if (quiet.includes(id)) { tagText = "Reaches nothing"; tagClass = "tag quiet"; }
      else if (exposed.has(id)) {
        const label = finding && rotate.has(id) ? "Rotate now" : keyTo.has(id) ? `Key to ${short(keyTo.get(id))}` : TAGS[sens] || "Sensitive data";
        tagText = before ? away : label;
        if (before) tagClass = "tag quiet";
      }
      if (tagText) {
        const tag = el("div", tagText, { class: tagClass });
        tag.style.left = `${pos.x}px`; tag.style.top = `${pos.y - 27}px`;
        canvas.append(tag);
      }
    }
    // The step this PR adds, called out where it happens.
    const first = [...edges.values()].find((e) => e.fresh);
    if (first) {
      const a = at(first.step.from), b = at(first.step.to);
      const ev = (r.evidence || {})[first.step.evidence];
      const use = codeUse[0];
      const where = codeMode
        ? (use && use.file ? ` · ${use.file.split("/").pop()}:${use.line}` : "")
        : ev && ev.line ? ` · ${ev.file.split("/").pop()}:${ev.line}` : "";
      const text = finding ? (before ? "Cut" : `Cut here to contain it${where}`)
        : codeMode ? (before ? "No code takes this route" : `Its code now takes this route${where}`)
        : before ? "This PR adds it" : `Added by this PR${where}`;
      const tag = el("div", text, { class: finding ? `tag${before ? " quiet" : " ok"}` : `tag${before ? " quiet" : ""}` });
      tag.style.left = `${a.x + W / 2}px`; tag.style.top = `${Math.min(a.y, b.y) - 27}px`;
      canvas.append(tag);
    }
    // A long route is scaled down to fit the stage rather than cut off at its right edge.
    const room = $("stage").clientWidth - 48;
    canvas.style.zoom = room > 0 && width > room ? String(room / width) : "";
    const actor = nameOf(drawn[0].actor);
    const use = codeUse[0];
    $("note").textContent = codeMode
      ? (before ? `Today, ${actor} could already take this route, but no code does.`
                : `If merged: ${actor}'s code takes this route to read ${nameOf(drawn[0].target)}${use && use.file ? `, at ${use.file}:${use.line}` : ""}. The PR doesn't mention it.`)
      : finding
      ? (before ? "With that one link cut, none of the highlighted data is reachable."
                : `${opened.length} ${opened.length === 1 ? "way" : "ways"} in from the compromised Action.`)
      : before ? `Today, ${actor} can't reach the highlighted data.`
      : `If merged: ${opened.length} new ${opened.length === 1 ? "way" : "ways"} in.`;
  }

  // Every access link in the PR's graph, laid out the way access flows: who acts, the groups and roles
  // they pass through, the secrets, then the data. Code calls are left out to keep it readable.
  const ACCESS_TYPES = new Set(["MEMBER_OF", "CAN_ASSUME", "TRUSTS", "RUNS_AS", "CAN", "UNLOCKS"]);
  const LANES = ["Who acts", "Groups", "Roles", "Secrets", "Data"];
  function lane(id) {
    const prefix = id.split(":")[0];
    if (["user", "entry", "workflow", "workload", "action"].includes(prefix)) return 0;
    if (prefix === "group") return 1;
    if (prefix === "role") return 2;
    const cat = (info(id).category || "").toLowerCase();
    return cat === "secret" || cat === "encryptionkey" ? 3 : 4;
  }
  let full = null;
  function drawFull() {
    const g = data.graphs.head || data.graphs.base;
    if (!g) { $("note").textContent = "The graph isn't in the store any more."; return; }
    const routes = new Set(opened.flatMap(routeOf));
    const sensitive = (id) => ["regulated", "confidential"].includes(info(id).sensitivity);
    // Internal data no path reaches (log groups, queues) only adds noise here.
    const shown = (id) => lane(id) < 4 || sensitive(id) || routes.has(id);
    const all = g.edges.filter((e) => ACCESS_TYPES.has(e.type));
    const linked = new Set(all.flatMap((e) => [e.src, e.dst]));
    const nodes = g.nodes.filter((n) => linked.has(n.id) && shown(n.id));
    const keep = new Set(nodes.map((n) => n.id));
    const links = all.filter((e) => keep.has(e.src) && keep.has(e.dst));
    const hidden = [...linked].filter((id) => !keep.has(id)).length;
    $("note").textContent = `${nodes.length} people, roles and sensitive resources, ${links.length} access links. ` +
      `The new ways in are red.${hidden ? ` ${hidden} internal resources are left out.` : ""}`;
    if (full) return;
    const go = () => {
      // Columns by lane; within a lane, order by where the links come from, so fewer lines cross.
      const cols = LANES.map(() => []);
      for (const n of nodes) cols[lane(n.id)].push(n.id);
      const pos = new Map();
      const preds = new Map();
      for (const e of links) { if (!preds.has(e.dst)) preds.set(e.dst, []); preds.get(e.dst).push(e.src); }
      cols.forEach((ids, c) => {
        const weight = (id) => {
          const from = (preds.get(id) || []).filter((s) => pos.has(s));
          return from.length ? from.reduce((sum, s) => sum + pos.get(s).y, 0) / from.length : Infinity;
        };
        ids.sort((a, b) => (c === 0 ? 0 : weight(a) - weight(b)) || kindOf(a, info(a)).localeCompare(kindOf(b, info(b))) || a.localeCompare(b));
        ids.forEach((id, i) => pos.set(id, { x: c * 250, y: i * 64 }));
      });
      // Lanes are centred on the tallest one.
      const tallest = Math.max(...cols.map((ids) => ids.length));
      cols.forEach((ids) => { const shift = ((tallest - ids.length) * 64) / 2; ids.forEach((id) => { pos.get(id).y += shift; }); });
      const hot = routes;
      const hotEdges = new Set([...edges.keys()]);
      // Drawn at a readable size across the page's width; the page scrolls, the graph doesn't zoom.
      const box = $("full");
      const graphW = (LANES.length - 1) * 250 + 150 + 60, graphH = (Math.max(...cols.map((ids) => ids.length)) - 1) * 64 + 42 + 70 + 60;
      const scale = Math.min(1, box.clientWidth / graphW);
      box.style.height = `${Math.ceil(graphH * scale) + 20}px`;
      const style = getComputedStyle(document.documentElement);
      const c = (name) => style.getPropertyValue(name).trim();
      full = cytoscape({
        container: $("full"),
        elements: [
          ...LANES.map((label, i) => ({ data: { id: `lane${i}`, label, lane: 1 }, position: { x: i * 250, y: -70 } })),
          ...nodes.map((n) => ({ data: { id: n.id, label: `${kindOf(n.id, info(n.id))}
${short(n.id)}`, hot: hot.has(n.id) ? 1 : 0,
                                         sens: ["regulated", "confidential"].includes(info(n.id).sensitivity) ? 1 : 0 },
                                 position: pos.get(n.id) })),
          ...links.map((e, i) => ({ data: { id: `e${i}`, source: e.src, target: e.dst,
                                            hot: hotEdges.has(`${e.src}|${e.type}|${e.dst}`) ? 1 : 0 } })),
        ],
        style: [
          { selector: "node", style: { shape: "round-rectangle", width: 150, height: 42, "background-color": c("--card"),
              "border-width": 1, "border-color": c("--tile-line"), label: "data(label)", "text-wrap": "wrap",
              "text-valign": "center", "font-size": 11, color: c("--muted"), "text-max-width": 140 } },
          { selector: "node[sens = 1]", style: { "border-color": c("--accent-soft"), "border-width": 1.5 } },
          { selector: "node[hot = 1]", style: { "border-color": c("--accent"), "border-width": 2.5, color: c("--text"),
              "font-weight": 600 } },
          { selector: "node[lane = 1]", style: { "background-opacity": 0, "border-width": 0, "font-size": 12,
              "font-weight": 700, color: c("--muted"), "text-transform": "uppercase", width: 150, height: 24 } },
          { selector: "edge", style: { width: 1, "line-color": c("--line"), "target-arrow-color": c("--line"),
              "target-arrow-shape": "triangle", "curve-style": "unbundled-bezier", "control-point-distances": [0],
              "arrow-scale": 0.7, opacity: 0.8 } },
          { selector: "edge[hot = 1]", style: { width: 2.5, "line-color": c("--accent"), "target-arrow-color": c("--accent"),
              opacity: 1, "z-index": 10 } },
        ],
        layout: { name: "preset", padding: 30, fit: true },
        userZoomingEnabled: false, userPanningEnabled: false, boxSelectionEnabled: false, autoungrabify: true,
      });
    };
    if (typeof cytoscape !== "undefined") { go(); return; }
    const s = el("script", null, { src: CYTOSCAPE.src, integrity: CYTOSCAPE.integrity, crossorigin: "anonymous",
                                   referrerpolicy: "no-referrer" });
    s.onload = go;
    s.onerror = () => { $("note").textContent = "The graph library didn't load. Try again in a moment."; };
    document.head.append(s);
  }

  if (finding) {
    $("v-after").textContent = "Blast radius";
    $("v-before").textContent = "Contained";
    $("v-before").before($("v-after"));
    $("v-before").hidden = !cut.length;
  }
  // Each fix, drawn on the graph copy the engine verified it on, against the PR's head: what it cuts (red,
  // dashed), what it adds (green), and the route that still gives the actor what the PR asked for (blue).
  // Only the fixes that pass: the others are named in the comment, so the page offers what is good.
  const fixes = finding ? [] : (r.candidates || []).filter((c) => c.verdict === "pass");
  // One change a fix makes, as a list item: the op, what it names, and what it trusts or removes.
  function opLine(op) {
    const args = op.args || {};
    const who = args.name || args.role || args.principal || args.user || args.policy_address || "";
    return add(el("li"), el("code", op.op.replace(/_/g, " ")), document.createTextNode(who ? ` ${who}` : ""),
      document.createTextNode(args.group ? ` from ${args.group}` : args.trust_principals ? `, trusted only by ${args.trust_principals.map(nameOf).join(", ")}` : ""));
  }
  const fixCache = new Map(); // fix id -> the promise of its graph, so a click and the background load share one request
  function loadFix(id) {
    if (!fixCache.has(id)) {
      const k = new URLSearchParams(location.search).get("k") || "";
      fixCache.set(id, fetch(`${location.pathname.replace(/\/$/, "")}/fixes/${encodeURIComponent(id)}?k=${encodeURIComponent(k)}`, { cache: "no-store" })
        .then((res) => (res.ok ? res.json() : null))
        .catch(() => null)
        .then((fx) => { if (!fx) fixCache.delete(id); return fx; }));
    }
    return fixCache.get(id);
  }
  // Once the page is up, fetch each passing fix's graph and the graph library, one after another, so a fix's
  // tab opens at once instead of waiting on the store.
  async function prefetchFixes() {
    if (typeof cytoscape === "undefined" && !document.querySelector("script[data-cytoscape]")) {
      const s = el("script", null, { src: CYTOSCAPE.src, integrity: CYTOSCAPE.integrity, crossorigin: "anonymous", referrerpolicy: "no-referrer", "data-cytoscape": "" });
      document.head.append(s);
    }
    for (const fx of fixes) await loadFix(fx.id);
  }
  // What to do about a PR: each fix that passed, the one Theseus recommends first. Every claim on a card is a
  // field the engine set on the candidate; where it can't back "closes" or "breaks nothing" the card says what it knows.
  function fixCards(box) {
    const ordered = [...fixes].sort((a, b) => Number(!!b.recommended) - Number(!!a.recommended) || (a.id < b.id ? -1 : 1));
    for (const fx of ordered) {
      const card = el("article", null, { class: "way" });
      const heading = el("h3", fixes.length === 1 ? fx.title : `Fix ${fx.id}: ${fx.title}`);
      if (fx.recommended) heading.append(el("span", "recommended", { class: "chip ok" }));
      const open = (fx.paths_left || []).length + (fx.new_paths || []).length;
      const broken = (fx.requirements_broken || []).length + (fx.calls_broken || []).length + (fx.unknown || []).length;
      const closes = open ? `${plural(open, "way")} in would remain` : opened.length === 1 ? "closes the way in" : `closes all ${opened.length} ways in`;
      const sub = `Tested on a copy of the graph: ${closes}${broken ? `, but ${plural(broken, "check")} did not come out clean` : " and breaks nothing"}.`;
      card.append(heading, el("div", sub, { class: "sub" }));
      const ul = el("ul", null, { class: "ops" });
      for (const op of fx.ops || []) ul.append(opLine(op));
      card.append(ul);
      const command = fixes.length === 1 ? "/theseus apply" : `/theseus apply ${fx.id}`;
      const actions = el("div", null, { class: "todo-actions" });
      actions.append(document.createTextNode("Commit Theseus's suggestion on the PR, or reply "), el("code", command), document.createTextNode(" to commit it."));
      const see = el("button", "See it on the graph", { type: "button" });
      see.addEventListener("click", () => {
        drawBoard(`fix:${fx.id}`);
        $("note").scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "center" });
      });
      actions.append(see);
      card.append(actions);
      box.append(card);
    }
    if (!fixes.length && opened.length) {
      const card = el("article", null, { class: "way" });
      card.append(el("h3", "No fix Theseus could prove safe"));
      const tried = r.candidates || [];
      card.append(el("div", tried.length ? "It tried these on a copy of the graph; none passed:" : "It found no change to try. Ask the author to narrow the access this PR grants.", { class: "sub" }));
      if (tried.length) {
        const ul = el("ul", null, { class: "ops" });
        for (const c of tried) ul.append(el("li", `${c.title}: ${c.reason || c.verdict}`));
        card.append(ul);
      }
      box.append(card);
    }
  }
  for (const fx of fixes) {
    const b = el("button", fixes.length === 1 ? "With the fix" : `With fix ${fx.id}`, { type: "button", "data-fix": fx.id, "aria-pressed": "false",
                                                    title: `${fx.title}: ${fx.verdict}${fx.recommended ? ", recommended" : ""}` });
    b.addEventListener("click", () => drawBoard(`fix:${fx.id}`));
    $("v-full").before(b);
  }
  const ekey = (e) => `${e.src}|${e.type}|${e.dst}`;
  function routeIn(g, from, to) {
    // The shortest access route in this graph, as edges; null when there is none.
    const out = new Map();
    for (const e of g.edges) if (ACCESS_TYPES.has(e.type)) { if (!out.has(e.src)) out.set(e.src, []); out.get(e.src).push(e); }
    const back = new Map([[from, null]]);
    const queue = [from];
    while (queue.length) {
      const at = queue.shift();
      if (at === to) break;
      for (const e of out.get(at) || []) if (!back.has(e.dst)) { back.set(e.dst, e); queue.push(e.dst); }
    }
    if (!back.has(to)) return null;
    const route = [];
    for (let at = to; back.get(at); at = back.get(at).src) route.unshift(back.get(at));
    return route;
  }
  let fixCy = null;
  async function drawFix(id) {
    const head = data.graphs.head;
    $("note").textContent = fixCache.has(id) ? `Loading fix ${id}'s graph…` : `Loading fix ${id}'s graph from FalkorDB…`;
    const fx = await loadFix(id);
    if (shown !== `fix:${id}`) return; // the view changed while this loaded
    if (!fx || !head) { $("note").textContent = "This fix's graph isn't in the store any more."; return; }
    const headEdges = new Map(head.edges.filter((e) => ACCESS_TYPES.has(e.type)).map((e) => [ekey(e), e]));
    const fixEdges = new Map(fx.edges.filter((e) => ACCESS_TYPES.has(e.type)).map((e) => [ekey(e), e]));
    const added = [...fixEdges.values()].filter((e) => !headEdges.has(ekey(e)));
    const openedKeys = new Set(opened.flatMap((p) => p.steps.map((s) => `${s.from}|${s.type}|${s.to}`)));
    const onRoute = new Set(opened.flatMap(routeOf));
    const removed = [...headEdges.values()].filter((e) => !fixEdges.has(ekey(e)) && (onRoute.has(e.src) || onRoute.has(e.dst)));
    const asked = ((r.intent && r.intent.grants) || []).map((g) => routeIn(fx, g.principal, g.resource)).filter(Boolean);
    const keptKeys = new Set(asked.flat().map(ekey));
    const still = opened.filter((p) => routeIn(fx, p.actor, p.target));
    const show = [...opened.flatMap((p) => p.steps.map((s) => ({ src: s.from, type: s.type, dst: s.to }))), ...added, ...removed, ...asked.flat()];
    const links = new Map();
    for (const e of show) links.set(ekey(e), e);
    const ids = new Set([...links.values()].flatMap((e) => [e.src, e.dst]));
    const nodeOf = new Map([...head.nodes, ...fx.nodes].map((n) => [n.id, n]));
    const kind = (nid) => kindOf(nid, info(nid).category ? info(nid) : nodeOf.get(nid) || {});
    const cols = LANES.map(() => []);
    for (const nid of ids) cols[lane(nid)].push(nid);
    const pos = new Map();
    cols.forEach((list, c) => list.sort().forEach((nid, i) => pos.set(nid, { x: c * 230, y: i * 76 })));
    const tallest = Math.max(1, ...cols.map((l) => l.length));
    cols.forEach((list) => { const shift = ((tallest - list.length) * 76) / 2; list.forEach((nid) => { pos.get(nid).y += shift; }); });
    const box = $("fixgraph");
    const graphW = (LANES.length - 1) * 230 + 160 + 60, graphH = (tallest - 1) * 76 + 42 + 70 + 60;
    const scale = Math.min(1, box.clientWidth / graphW);
    box.style.height = `${Math.ceil(graphH * scale) + 20}px`;
    const state = (e) => (!fixEdges.has(ekey(e)) ? "cut" : !headEdges.has(ekey(e)) ? "added" : keptKeys.has(ekey(e)) ? "kept" : "same");
    const reachable = new Set(still.map((p) => p.target));
    const go = () => {
      if (fixCy) fixCy.destroy();
      const style = getComputedStyle(document.documentElement);
      const c = (name) => style.getPropertyValue(name).trim();
      fixCy = cytoscape({
        container: box,
        elements: [
          ...LANES.map((label, i) => ({ data: { id: `lane${i}`, label, lane: 1 }, position: { x: i * 230, y: -70 } })),
          ...[...ids].map((nid) => ({ data: { id: nid, label: `${kind(nid)}\n${short(nid)}`, isnew: nodeOf.has(nid) && !head.nodes.some((n) => n.id === nid) ? 1 : 0,
                                             exposed: opened.some((p) => p.target === nid) ? (reachable.has(nid) ? 2 : 1) : 0 }, position: pos.get(nid) })),
          ...[...links.values()].map((e, i) => ({ data: { id: `f${i}`, source: e.src, target: e.dst, state: state(e) } })),
        ],
        style: [
          { selector: "node", style: { shape: "round-rectangle", width: 160, height: 44, "background-color": c("--card"), "border-width": 1,
              "border-color": c("--tile-line"), label: "data(label)", "text-wrap": "wrap", "text-valign": "center", "font-size": 11,
              color: c("--muted"), "text-max-width": 150, "font-family": "Inter, system-ui, sans-serif" } },
          { selector: "node[exposed = 1]", style: { "border-color": c("--faint"), "border-style": "dashed", color: c("--faint") } },
          { selector: "node[exposed = 2]", style: { "border-color": c("--accent"), "border-width": 2.5, color: c("--text") } },
          { selector: "node[isnew = 1]", style: { "border-color": c("--ok"), "border-width": 2.5, color: c("--text") } },
          { selector: "node[lane = 1]", style: { "background-opacity": 0, "border-width": 0, "font-size": 11, "font-weight": 600,
              color: c("--muted"), "text-transform": "uppercase", width: 160, height: 22 } },
          { selector: "edge", style: { width: 1.2, "line-color": c("--tile-line"), "target-arrow-color": c("--tile-line"),
              "target-arrow-shape": "triangle", "curve-style": "bezier", "arrow-scale": 0.8 } },
          { selector: "edge[state = 'cut']", style: { "line-color": c("--accent"), "target-arrow-color": c("--accent"), "line-style": "dashed", width: 2.2 } },
          { selector: "edge[state = 'added']", style: { "line-color": c("--ok"), "target-arrow-color": c("--ok"), width: 2.6 } },
          { selector: "edge[state = 'kept']", style: { "line-color": c("--primary"), "target-arrow-color": c("--primary"), width: 2.6 } },
        ],
        layout: { name: "preset", padding: 30, fit: true },
        userZoomingEnabled: false, userPanningEnabled: false, boxSelectionEnabled: false, autoungrabify: true,
      });
    };
    const verdict = fx.verdict === "pass" ? "passes" : fx.verdict === "fail" ? "fails" : `is ${fx.verdict}`;
    const which = fixes.length === 1 ? "The fix" : `Fix ${fx.id}`;
    const viaNew = asked.length && asked.flat().every((e) => !headEdges.has(ekey(e)));
    const keeps = asked.length ? ` ${nameOf(r.intent.grants[0].principal)} can still ${access([r.intent.grants[0].access])} ${short(r.intent.grants[0].resource)}, the access the PR asked for, ${viaNew ? "through the new links" : "along the blue links"}.` : "";
    $("note").textContent = `${which} ${verdict}: it cuts ${plural(removed.length, "link")} (red, dashed) and adds ${plural(added.length, "link")} (green). ` +
      (still.length ? `${plural(still.length, "way")} in ${still.length === 1 ? "is" : "are"} still open.` : `None of the ${plural(opened.length, "way")} in remains.`) + keeps;
    const ops = $("fixops");
    const list = el("ul");
    for (const op of fx.ops || []) list.append(opLine(op));
    ops.replaceChildren(el("div", `What ${which.toLowerCase()} changes, ${fx.verdict === "pass" ? "checked on a copy of the graph" : `and why it doesn't pass: ${fx.reason || fx.verdict}`}:`), list);
    if (fx.verdict === "pass") {
      const command = fixes.length === 1 ? "/theseus apply" : `/theseus apply ${fx.id}`;
      ops.append(el("div", `Commit Theseus's suggestion on the PR, or reply ${command} to commit it.`, { style: "margin-top:8px" }));
    }
    if (typeof cytoscape !== "undefined") { go(); return; }
    const s = el("script", null, { src: CYTOSCAPE.src, integrity: CYTOSCAPE.integrity, crossorigin: "anonymous", referrerpolicy: "no-referrer" });
    s.onload = go;
    s.onerror = () => { $("note").textContent = "The graph library didn't load. Try again in a moment."; };
    document.head.append(s);
  }

  $("v-before").addEventListener("click", () => drawBoard("before"));
  $("v-after").addEventListener("click", () => drawBoard("after"));
  $("v-full").addEventListener("click", () => drawBoard("full"));
  drawBoard("after");
  if (fixes.length) setTimeout(prefetchFixes, 0);

  // Every step, with the line it comes from.
  const blob = (file, line) => {
    const root = data.world_root.replace(/^\/+|\/+$/g, "");
    const path = `${root}/${file}`.split("/").map(encodeURIComponent).join("/");
    const repo = data.repo.split("/").map(encodeURIComponent).join("/");
    return `https://github.com/${repo}/blob/${encodeURIComponent(data.head_sha)}/${path}${line ? `#L${line}` : ""}`;
  };
  if (!opened.length) $("steps-section").hidden = true;
  for (const p of opened) {
    const card = el("article", null, { class: "way" });
    card.append(el("h3", `${nameOf(p.actor)} → ${nameOf(p.target)}`),
                el("div", `Can ${access(p.grants)} · ${HOLDS[p.sensitivity] || "unclassified data"} · ${p.steps.length} steps`, { class: "sub" }));
    const ol = el("ol");
    for (const s of p.steps) {
      const li = el("li", `${nameOf(s.from)} ${verb(s)} ${nameOf(s.to)}`);
      const ev = (r.evidence || {})[s.evidence];
      if (ev && ev.file && ev.file !== "unknown") {
        const src = el("span", null, { class: "src" });
        src.append(el("a", `${ev.file}${ev.line ? `:${ev.line}` : ""}`, { href: blob(ev.file, ev.line), target: "_blank", rel: "noopener" }));
        li.append(src);
      } else if (ev) {
        li.append(el("span", ev.note ? `(from ${ev.note})` : "(inferred)", { class: "src" }));
      }
      if (marked(s)) li.append(el("span", finding ? "cut here" : "new", { class: finding ? "chip ok" : "chip" }));
      ol.append(li);
    }
    card.append(ol);
    $("ways").append(card);
  }

  if (finding) {
    const todo = $("todo");
    const card = (title, sub) => {
      const c = el("article", null, { class: "way" });
      c.append(el("h3", title));
      if (sub) c.append(el("div", sub, { class: "sub" }));
      todo.append(c);
      return c;
    };
    for (const c of cut) {
      const box = card("Cut one link", `It carries every way in. Cut it and ${list(opened.map((p) => short(p.target)).filter((v, i, a) => a.indexOf(v) === i))} are out of reach.`);
      const line = el("p", `${short(c.src)} ${verb({ type: c.type, grants: [] })} ${short(c.dst)}`);
      const ev = (r.evidence || {})[c.evidence];
      if (ev && ev.file && ev.file !== "unknown") {
        line.append(" ");
        line.append(el("a", `${ev.file}${ev.line ? `:${ev.line}` : ""}`, { href: blob(ev.file, ev.line), target: "_blank", rel: "noopener" }));
      }
      box.append(line);
    }
    if (rotate.size) {
      const box = card("Rotate now", "The compromised workflows can read these. Treat them as leaked.");
      const ul = el("ul");
      for (const s of rotate) ul.append(el("li", `${nameOf(s)} (${kindOf(s, info(s))})`));
      box.append(ul);
    }
    const staging = r.staging_to_prod || [];
    if (staging.length) {
      const box = card("Staging reaches production", "A workflow meant for previews can reach production data.");
      const ul = el("ul");
      for (const s of staging) ul.append(el("li", `${short(s.actor)} → ${nameOf(s.target)}`));
      box.append(ul);
    }
    const chokes = (r.choke_points || []).slice(0, 3);
    if (chokes.length) {
      card("Where to harden", `Most routes to sensitive data pass through ${list(chokes.map((c) => short(c.id)))}.`);
    }
    $("todo-section").hidden = !todo.childElementCount;
  } else {
    fixCards($("todo"));
    $("todo-section").hidden = !$("todo").childElementCount;
  }

  // Access that was there before this PR: not its doing, but worth knowing.
  if (already.length) {
    $("already-section").hidden = false;
    $("already-title").textContent = `${already.length} more ${already.length === 1 ? "way" : "ways"} in exist today, without this PR`;
    for (const p of already) $("already").append(el("li", `${nameOf(p.actor)} → ${nameOf(p.target)}`));
  }

  const g = data.graphs.head || data.graphs.base;
  $("footer").textContent = g
    ? `Built from ${g.nodes.length} resources and ${g.edges.length} connections, read live from FalkorDB.`
    : "";
}

main();
</script>
</body>
</html>
