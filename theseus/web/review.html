<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Theseus review</title>
<style>
  :root {
    --bg: #fafaf9; --dot: #e3e3df; --card: #ffffff; --text: #1c1c1a; --muted: #6b6b66; --faint: #a3a39d;
    --line: #d9d9d4; --tile-line: #cfcfca; --accent: #d1005a; --accent-bg: #fff0f6; --accent-soft: #f7c6db;
    --ok: #1a7f37; --ok-bg: #e9f7ee; --warn: #9a6700; --warn-bg: #fff6d6; --chip: #f1f1ee;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111110; --dot: #262624; --card: #1a1a19; --text: #ededea; --muted: #a3a39d; --faint: #6b6b66;
      --line: #34342f; --tile-line: #3f3f3a; --accent: #ff4d94; --accent-bg: #33121f; --accent-soft: #6b2443;
      --ok: #3fb950; --ok-bg: #12301b; --warn: #d29922; --warn-bg: #3a2a07; --chip: #262624;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); background: var(--bg);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  header { border-bottom: 1px solid var(--line); background: var(--card); }
  header .wrap { display: flex; align-items: center; gap: 14px; height: 56px; }
  .brand { font-weight: 700; letter-spacing: -.01em; }
  .where { color: var(--muted); font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
  .badge { margin-left: auto; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 3px 10px;
           border-radius: 999px; white-space: nowrap; }
  .badge.blocked { color: var(--accent); background: var(--accent-bg); }
  .badge.look { color: var(--warn); background: var(--warn-bg); }
  .badge.clear { color: var(--ok); background: var(--ok-bg); }

  .hero { padding: 36px 0 8px; }
  .hero h1 { font-size: 30px; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 10px; max-width: 900px; }
  .hero h1 em { font-style: normal; color: var(--accent); }
  .hero p { margin: 0; color: var(--muted); font-size: 16px; max-width: 820px; }

  .board { margin: 24px 0 8px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
           background-color: var(--bg);
           background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 16px 16px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line);
         background: var(--card); flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--muted); font: 600 13px/1 var(--mono);
                padding: 8px 12px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
  .bar .note { color: var(--muted); font-size: 13px; }
  .stage { position: relative; overflow-x: auto; padding: 28px 24px 24px; }
  .canvas { position: relative; margin: 0 auto; }
  .canvas > svg { position: absolute; inset: 0; overflow: visible; pointer-events: none; }

  .tile { position: absolute; width: 132px; height: 92px; border: 1px solid var(--tile-line); border-radius: 6px;
          background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 4px; padding: 6px 8px; text-align: center; transition: opacity .2s, border-color .2s; }
  .tile svg.icon { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.6;
                   stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
  .tile .kind { font: 11px/1 var(--mono); color: var(--muted); text-transform: lowercase; }
  .tile .name { font-size: 12.5px; font-weight: 600; line-height: 1.2; max-width: 116px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  .tile.exposed { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .tile.exposed svg.icon, .tile.exposed .kind { color: var(--accent); }
  .tile.actor { border-color: var(--text); }
  .tile.off { opacity: .38; }
  .tag { position: absolute; font: 600 11.5px/1.3 var(--mono); padding: 4px 7px; border-radius: 4px; white-space: nowrap;
         background: var(--accent); color: #fff; }
  .tag.quiet { background: var(--chip); color: var(--muted); }
  .edge-label { font: 11px/1 var(--mono); fill: var(--muted); }
  .edge-label.new { fill: var(--accent); font-weight: 700; }

  section { padding: 28px 0 8px; }
  section h2 { font-size: 13px; font-family: var(--mono); font-weight: 600; text-transform: uppercase;
               letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; }
  .ways { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .way { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .way h3 { margin: 0 0 4px; font-size: 15px; overflow-wrap: anywhere; }
  .way .sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .way ol { margin: 0; padding-left: 20px; }
  .way li { margin: 4px 0; font-size: 14px; overflow-wrap: anywhere; }
  .way li .src { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-left: 6px; }
  .way li .src a { color: var(--muted); }
  .chip { display: inline-block; font: 600 11px/1 var(--mono); padding: 3px 6px; border-radius: 4px; margin-left: 6px;
          background: var(--accent); color: #fff; vertical-align: 1px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
  details summary { cursor: pointer; font-weight: 600; }
  details ul { margin: 10px 0 0; padding-left: 20px; color: var(--muted); }
  #full { height: 70vh; min-height: 420px; }
  footer { padding: 28px 0 40px; color: var(--muted); font-size: 13px; }
  .message { padding: 80px 0; color: var(--muted); font-size: 16px; }
  @media (max-width: 720px) {
    .wrap { padding: 0 16px; }
    .hero h1 { font-size: 24px; }
    .stage { padding: 20px 12px; }
  }
</style>
</head>
<body>
<header><div class="wrap">
  <span class="brand">Theseus</span>
  <span class="where" id="where"></span>
  <span class="badge" id="badge" hidden></span>
</div></header>

<main class="wrap" id="main" hidden>
  <div class="hero">
    <h1 id="title"></h1>
    <p id="lede"></p>
  </div>

  <div class="board">
    <div class="bar">
      <div class="seg" role="group" aria-label="View">
        <button type="button" id="v-before" aria-pressed="false">Before</button>
        <button type="button" id="v-after" aria-pressed="true">After this PR</button>
        <button type="button" id="v-full" aria-pressed="false">Whole graph</button>
      </div>
      <span class="note" id="note"></span>
    </div>
    <div class="stage" id="stage"><div class="canvas" id="canvas"></div></div>
    <div id="full" hidden></div>
  </div>

  <section id="steps-section">
    <h2>Step by step</h2>
    <div class="ways" id="ways"></div>
  </section>

  <section id="already-section" hidden>
    <details>
      <summary id="already-title"></summary>
      <ul id="already"></ul>
    </details>
  </section>
</main>

<div class="wrap"><footer id="footer"></footer></div>

<script>
"use strict";
const CYTOSCAPE = { src: "https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js",
  integrity: "sha512-EY3U1MWdgKx0P1dqTE4inlKz2cpXtWpsR1YUyD855Hs6RL/A0cyvrKh60EpE8wDZ814cTe1KgRK+sG0Rn792vQ==" };

// Short words for a tile: what a thing is.
const KINDS = { user: "user", group: "group", role: "role", workload: "service", workflow: "CI workflow",
                action: "GitHub Action", entry: "internet" };
const CATEGORIES = { objectstorage: "storage", filestorage: "file share", blockstorage: "disk", database: "database",
                     secret: "secret", encryptionkey: "key", aimodel: "AI model", logstore: "logs",
                     messagequeue: "queue", messagetopic: "topic", datastream: "stream" };
// What the data is, for people outside security.
const HOLDS = { regulated: "personal and payment data", confidential: "business data",
                internal: "internal data", public: "public data" };
const TAGS = { regulated: "Customer data", confidential: "Business data" };
const VERBS = { MEMBER_OF: "is in", CAN_ASSUME: "can become", TRUSTS: "can log in as", RUNS_AS: "runs as",
                UNLOCKS: "opens", USES: "uses", CALLS: "calls", REQUESTS: "calls", HAS_ENV: "is configured with" };
const RANK = { regulated: 0, confidential: 1 };

// Line icons, drawn here: no data ever reaches them.
const ICONS = {
  user: "M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0",
  group: "M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 6.5M18 13.5a6.5 6.5 0 0 1 3.5 6.5",
  role: "M4 5h16v14H4zM8 10h3M8 14h8M15 10h1",
  secret: "M15 7a4 4 0 1 1-3.9 5H4v3h3v3h3v-3h1.1A4 4 0 0 1 15 7zM15 10.5h.01",
  database: "M4 6c0 1.7 3.6 3 8 3s8-1.3 8-3-3.6-3-8-3-8 1.3-8 3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3",
  storage: "M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7M12 11v10",
  service: "M12 2l8.5 5v10L12 22l-8.5-5V7z",
  "CI workflow": "M5 4l14 8-14 8z",
  internet: "M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.8 2.5 15.2 0 18M12 3c-2.5 2.8-2.5 15.2 0 18",
  logs: "M6 3h9l3 3v15H6zM9 9h6M9 13h6M9 17h4",
  queue: "M3 6h18M3 12h18M3 18h12",
  topic: "M4 12a8 8 0 0 1 16 0M8 12a4 4 0 0 1 8 0M12 12v8",
  other: "M5 5h14v14H5z",
};

const $ = (id) => document.getElementById(id);
function el(tag, text, attrs) {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = text;
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}
function svg(tag, attrs) {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
  return node;
}

function nameOf(id) {
  if (id === "entry:internet") return "anyone on the internet";
  const url = id.indexOf("://");
  if (url >= 0) return id.slice(url + 3);
  const i = id.indexOf(":");
  return i < 0 ? id : id.slice(i + 1);
}
function kindOf(id, info) {
  const prefix = id.split(":")[0];
  if (KINDS[prefix]) return KINDS[prefix];
  const cat = ((info && info.category) || "").toLowerCase().replace(/_/g, "");
  return CATEGORIES[cat] || "data";
}
function short(id) {
  // A storage location reads best as its folder; the full name is in the tooltip.
  const name = nameOf(id).replace(/\/$/, "");
  const parts = name.split("/");
  return parts.length > 1 ? parts[parts.length - 1] + "/" : name;
}
function access(grants) {
  const g = (grants || []).filter((x) => x === "read" || x === "write").sort();
  return g.length === 2 ? "read and change" : g[0] === "write" ? "change" : g[0] === "read" ? "read" : "reach";
}
function verb(step) { return step.type === "CAN" ? `can ${access(step.grants)}` : VERBS[step.type] || step.type.toLowerCase(); }
function rank(p) {
  const last = p.steps.length ? p.steps[p.steps.length - 1].type : "";
  return [RANK[p.sensitivity] ?? 2, last === "UNLOCKS" ? 0 : 1, p.steps.length, p.id];
}
function byRank(a, b) {
  const x = rank(a), y = rank(b);
  for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
  return 0;
}
function list(items) {
  if (items.length <= 1) return items.join("");
  return `${items.slice(0, -1).join(", ")} and ${items[items.length - 1]}`;
}

function fail(text) {
  $("main").hidden = true;
  $("footer").replaceChildren(el("p", text, { class: "message" }));
}

async function main() {
  const k = new URLSearchParams(location.search).get("k") || "";
  let data;
  try {
    const res = await fetch(`${location.pathname.replace(/\/$/, "")}/data?k=${encodeURIComponent(k)}`, { cache: "no-store" });
    if (!res.ok) throw new Error(String(res.status));
    data = await res.json();
  } catch (e) {
    fail("This link doesn't open a review. It may be mistyped, or the PR hasn't been reviewed yet.");
    return;
  }
  render(data);
}

function render(data) {
  const r = data.result;
  const info = (id) => (r.nodes || {})[id] || {};
  const changed = new Set((r.changes || []).map((c) => c.address));
  const isNew = (step) => { const ev = (r.evidence || {})[step.evidence]; return !!ev && changed.has(ev.address); };
  const opened = [...r.opened].sort(byRank);
  const already = [...(r.unchanged || [])].sort(byRank);

  document.title = `${data.repo} #${data.number} · Theseus`;
  $("where").textContent = `${data.repo} #${data.number} · ${data.head_sha.slice(0, 7)}`;
  const badge = $("badge");
  badge.hidden = false;
  badge.className = `badge ${data.verdict.level}`;
  badge.textContent = { blocked: "Merge blocked", look: "Needs a look", clear: "Safe to merge" }[data.verdict.level];
  $("main").hidden = false;

  // The finding, in one sentence and one line under it.
  const title = $("title"), lede = $("lede");
  const intent = r.intent;
  const asked = intent && intent.stated
    ? (intent.grants || []).map((g) => `${g.access === "write" ? "change" : g.access === "assume" ? "become" : "read"} ${nameOf(g.resource)}`)
    : [];
  const askedLine = !intent ? "" : !intent.stated ? " The PR doesn't say what it's for."
    : asked.length ? ` The PR only asked to ${list(asked)}.` : " The PR says it changes no access.";
  if (opened.length) {
    const top = opened[0];
    title.append(`${nameOf(top.actor)} can now ${access(top.grants)} `);
    title.append(el("em", nameOf(top.target)));
    title.append(".");
    const more = opened.length > 1 ? ` This PR opens ${opened.length} ways in.` : "";
    lede.textContent = `${nameOf(top.target)} holds ${HOLDS[top.sensitivity] || "data Theseus can't classify"}.${more}${askedLine}`;
  } else if ((r.use_beyond_intent || []).length) {
    const use = r.use_beyond_intent[0];
    title.textContent = `${nameOf(use.workload)}'s code now reads ${nameOf(use.resource)}.`;
    lede.textContent = `${askedLine.trim()} See ${use.file}:${use.line}.`.trim();
  } else if ((r.unknowns || []).length) {
    title.textContent = "Part of this change couldn't be checked.";
    lede.textContent = r.unknowns.slice(0, 3).join(" · ");
  } else {
    title.textContent = "No new access to sensitive data.";
    lede.textContent = askedLine.trim();
  }

  // The picture: one row per way in, left to right, the way access flows.
  const COL = 196, ROW = 128, W = 132, H = 92, PAD = 28;
  const place = new Map(), used = new Map();
  let rows = 0;
  const routeOf = (p) => (p.steps.length ? [p.steps[0].from, ...p.steps.map((s) => s.to)] : [p.actor]);
  for (const p of opened) {
    let row = null;
    routeOf(p).forEach((id, col) => {
      if (place.has(id)) { row = place.get(id).row; return; }
      const taken = used.get(col) || new Set();
      let r0 = row === null ? 0 : row;
      while (taken.has(r0)) r0++;
      taken.add(r0); used.set(col, taken);
      place.set(id, { col, row: r0 });
      row = r0; rows = Math.max(rows, r0 + 1);
    });
  }
  const edges = new Map();
  for (const p of opened) for (const s of p.steps) {
    const key = `${s.from}|${s.type}|${s.to}`;
    if (!edges.has(key)) edges.set(key, { step: s, fresh: isNew(s) });
  }
  // Past a step this PR adds, nothing was reachable before it.
  const outOfReach = new Set();
  for (const p of opened) {
    const i = p.steps.findIndex(isNew);
    p.steps.slice(i < 0 ? p.steps.length - 1 : i).forEach((s) => outOfReach.add(s.to));
    if (!p.steps.length) outOfReach.add(p.target);
  }
  const exposed = new Set(opened.map((p) => p.target));
  const cols = Math.max(1, ...[...place.values()].map((v) => v.col + 1));

  function drawBoard(mode) {
    $("stage").hidden = mode === "full";
    $("full").hidden = mode !== "full";
    for (const id of ["before", "after", "full"]) $(`v-${id}`).setAttribute("aria-pressed", String(mode === id));
    if (mode === "full") { drawFull(); return; }
    const canvas = $("canvas");
    canvas.replaceChildren();
    if (!opened.length) {
      canvas.style.width = "auto"; canvas.style.height = "auto";
      canvas.append(el("p", "Nothing new to draw: this PR opens no way in to sensitive data.", { class: "note" }));
      $("note").textContent = "";
      return;
    }
    const before = mode === "before";
    const width = cols * COL - (COL - W) + PAD * 2, height = rows * ROW - (ROW - H) + PAD * 2 + 30;
    canvas.style.width = `${width}px`; canvas.style.height = `${height}px`;
    const layer = svg("svg", { width, height, viewBox: `0 0 ${width} ${height}` });
    const defs = svg("defs");
    for (const [id, color] of [["arrow", "var(--faint)"], ["arrow-new", "var(--accent)"]]) {
      const m = svg("marker", { id, viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" });
      m.append(svg("path", { d: "M0 0L10 5L0 10z", fill: color }));
      defs.append(m);
    }
    layer.append(defs);
    canvas.append(layer);
    const at = (id) => { const p = place.get(id); return { x: PAD + p.col * COL, y: PAD + 30 + p.row * ROW }; };

    for (const { step, fresh } of edges.values()) {
      const a = at(step.from), b = at(step.to);
      const x1 = a.x + W, y1 = a.y + H / 2, x2 = b.x - 2, y2 = b.y + H / 2, dx = (x2 - x1) / 2;
      const hot = fresh && !before;
      const path = svg("path", { d: `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`, fill: "none",
                                 stroke: hot ? "var(--accent)" : "var(--faint)", "stroke-width": hot ? 2.5 : 1.4,
                                 "marker-end": `url(#${hot ? "arrow-new" : "arrow"})` });
      if (fresh && before) path.setAttribute("stroke-dasharray", "5 5");
      layer.append(path);
      const label = svg("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 8, "text-anchor": "middle",
                                  class: `edge-label${hot ? " new" : ""}` });
      label.textContent = fresh && before ? "not there yet" : verb(step);
      layer.append(label);
    }

    for (const [id, p] of place) {
      const pos = at(id);
      const kind = kindOf(id, info(id));
      const tile = el("div", null, { class: "tile", title: id });
      tile.style.left = `${pos.x}px`; tile.style.top = `${pos.y}px`;
      const icon = svg("svg", { class: "icon", viewBox: "0 0 24 24", "aria-hidden": "true" });
      icon.append(svg("path", { d: ICONS[kind] || ICONS.other }));
      tile.append(icon, el("div", kind, { class: "kind" }), el("div", short(id), { class: "name" }));
      const sens = info(id).sensitivity;
      if (p.col === 0) tile.classList.add("actor");
      if (before && outOfReach.has(id)) tile.classList.add("off");
      else if (exposed.has(id) || sens === "regulated" || sens === "confidential") tile.classList.add("exposed");
      canvas.append(tile);
      // A tag over the data this PR exposes, the way a reviewer would say it.
      if (exposed.has(id)) {
        const tag = el("div", before ? "Out of reach before" : TAGS[sens] || "Sensitive data", { class: `tag${before ? " quiet" : ""}` });
        tag.style.left = `${pos.x}px`; tag.style.top = `${pos.y - 27}px`;
        canvas.append(tag);
      }
    }
    // The step this PR adds, called out where it happens.
    const first = [...edges.values()].find((e) => e.fresh);
    if (first) {
      const a = at(first.step.from), b = at(first.step.to);
      const ev = (r.evidence || {})[first.step.evidence];
      const where = ev && ev.line ? ` · ${ev.file.split("/").pop()}:${ev.line}` : "";
      const tag = el("div", before ? "This PR adds this" : `New in this PR${where}`, { class: `tag${before ? " quiet" : ""}` });
      tag.style.left = `${a.x + W - 30}px`; tag.style.top = `${Math.max(a.y, b.y) + H + 10}px`;
      canvas.append(tag);
    }
    const actor = nameOf(opened[0].actor);
    $("note").textContent = before
      ? `Before this PR, ${actor} couldn't reach the highlighted data.`
      : `${opened.length} new ${opened.length === 1 ? "way" : "ways"} in.`;
  }

  // The whole graph, as FalkorDB holds it, for anyone who wants to look around.
  let full = null;
  function drawFull() {
    const g = data.graphs.head;
    if (!g) { $("note").textContent = "The graph isn't in the store any more."; return; }
    $("note").textContent = `${g.nodes.length} resources and ${g.edges.length} connections. The new ways in are highlighted.`;
    if (full) return;
    const go = () => {
      const hot = new Set(opened.flatMap(routeOf));
      const style = getComputedStyle(document.documentElement);
      const c = (name) => style.getPropertyValue(name).trim();
      full = cytoscape({
        container: $("full"),
        elements: [
          ...g.nodes.map((n) => ({ data: { id: n.id, label: `${kindOf(n.id, info(n.id))}\n${short(n.id)}`, hot: hot.has(n.id) ? 1 : 0 } })),
          ...g.edges.map((e, i) => ({ data: { id: `e${i}`, source: e.src, target: e.dst,
                                               hot: hot.has(e.src) && hot.has(e.dst) ? 1 : 0 } })),
        ],
        style: [
          { selector: "node", style: { shape: "round-rectangle", width: 96, height: 44, "background-color": c("--card"),
              "border-width": 1, "border-color": c("--tile-line"), label: "data(label)", "text-wrap": "wrap",
              "text-valign": "center", "font-size": 9, color: c("--muted"), "text-max-width": 88 } },
          { selector: "node[hot = 1]", style: { "border-color": c("--accent"), "border-width": 2, color: c("--text") } },
          { selector: "edge", style: { width: 1, "line-color": c("--line"), "target-arrow-color": c("--line"),
              "target-arrow-shape": "triangle", "curve-style": "bezier", "arrow-scale": 0.7 } },
          { selector: "edge[hot = 1]", style: { width: 2, "line-color": c("--accent"), "target-arrow-color": c("--accent") } },
        ],
        layout: { name: "cose", animate: false, nodeRepulsion: 12000, idealEdgeLength: 90, padding: 24 },
        wheelSensitivity: 0.2,
      });
    };
    if (typeof cytoscape !== "undefined") { go(); return; }
    const s = el("script", null, { src: CYTOSCAPE.src, integrity: CYTOSCAPE.integrity, crossorigin: "anonymous",
                                   referrerpolicy: "no-referrer" });
    s.onload = go;
    s.onerror = () => { $("note").textContent = "The graph library didn't load. Try again in a moment."; };
    document.head.append(s);
  }

  $("v-before").addEventListener("click", () => drawBoard("before"));
  $("v-after").addEventListener("click", () => drawBoard("after"));
  $("v-full").addEventListener("click", () => drawBoard("full"));
  drawBoard("after");

  // Every step, with the line it comes from.
  const blob = (file, line) => {
    const root = data.world_root.replace(/^\/+|\/+$/g, "");
    const path = `${root}/${file}`.split("/").map(encodeURIComponent).join("/");
    const repo = data.repo.split("/").map(encodeURIComponent).join("/");
    return `https://github.com/${repo}/blob/${encodeURIComponent(data.head_sha)}/${path}${line ? `#L${line}` : ""}`;
  };
  if (!opened.length) $("steps-section").hidden = true;
  for (const p of opened) {
    const card = el("article", null, { class: "way" });
    card.append(el("h3", `${nameOf(p.actor)} → ${nameOf(p.target)}`),
                el("div", `Can ${access(p.grants)} · ${HOLDS[p.sensitivity] || "unclassified data"} · ${p.steps.length} steps`, { class: "sub" }));
    const ol = el("ol");
    for (const s of p.steps) {
      const li = el("li", `${nameOf(s.from)} ${verb(s)} ${nameOf(s.to)}`);
      const ev = (r.evidence || {})[s.evidence];
      if (ev && ev.file && ev.file !== "unknown") {
        const src = el("span", null, { class: "src" });
        src.append(el("a", `${ev.file}${ev.line ? `:${ev.line}` : ""}`, { href: blob(ev.file, ev.line), target: "_blank", rel: "noopener" }));
        li.append(src);
      } else if (ev) {
        li.append(el("span", ev.note ? `(from ${ev.note})` : "(inferred)", { class: "src" }));
      }
      if (isNew(s)) li.append(el("span", "new", { class: "chip" }));
      ol.append(li);
    }
    card.append(ol);
    $("ways").append(card);
  }

  // Access that was there before this PR: not its doing, but worth knowing.
  if (already.length) {
    $("already-section").hidden = false;
    $("already-title").textContent = `${already.length} more ${already.length === 1 ? "way" : "ways"} in already existed before this PR`;
    for (const p of already) $("already").append(el("li", `${nameOf(p.actor)} → ${nameOf(p.target)}`));
  }

  const g = data.graphs.head;
  $("footer").textContent = g
    ? `Built from ${g.nodes.length} resources and ${g.edges.length} connections, read live from FalkorDB.`
    : "";
}

main();
</script>
</body>
</html>
