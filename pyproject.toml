[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "theseus"
description = "A graph agent that reviews infrastructure changes before merge (FalkorDB Graph Hacks, Track 01)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
    "falkordb>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "litellm>=1.60",
    "mcp>=1.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "python-hcl2>=5.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.8",
]

[project.scripts]
theseus = "theseus.cli:run"

[tool.setuptools.dynamic]
version = { attr = "theseus.__version__" }

[tool.setuptools.packages.find]
include = ["theseus*"]

[tool.setuptools.package-data]
theseus = ["agent/templates/*.md", "web/*", "adapters/*/catalog.yaml"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["demo-infra", "fixtures"]
# tools/ and .githooks/ run on whatever `python` is on PATH, so keep them 3.10-compatible.
per-file-target-version = { "tools/*.py" = "py310" }

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
markers = [
    "falkordb: needs a FalkorDB server (FALKORDB_HOST)",
    "live: makes real LLM or Jev calls (THESEUS_LIVE=1)",
]
